let ANCRAGE=null,TAMPER={id:null,text:null},SEL=null;
async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function canon(n){ const r=(TAMPER.id===n.id)?TAMPER.text:n.resume;
  return JSON.stringify({id:n.id,type:n.type,numero:n.numero,ds:n.ds,dp:n.dp,autorite:n.autorite,intitule:n.intitule,resume:r,themes:n.th,pages:n.pages}); }
async function arbre(L){ let n=await Promise.all(L.map(x=>sha(canon(x)))); const N=[n];
  while(n.length>1){ const s=[]; for(let i=0;i<n.length;i+=2) s.push(await sha(n[i]+(n[i+1]||n[i]))); N.push(s); n=s; } return N; }
function preuve(N,i){ const p=[]; for(let l=0;l<N.length-1;l++){ const v=N[l];
  p.push({cote:i%2===0?'droite':'gauche',hash:i%2===0?(v[i+1]||v[i]):v[i-1]}); i=Math.floor(i/2); } return p; }
const court=h=>h.slice(0,12)+'…'+h.slice(-6);

async function renderInteg(){
  const L=OPAC();
  if(!L.length) return vide("Aucune notice à sceller. Le registre se constitue au fil des validations.");
  if(!crypto.subtle) return vide("Le calcul d'empreintes n'est pas disponible dans ce contexte.");
  if(SEL===null||!L.some(n=>n.id===SEL)) SEL=L[0].id;
  if(!ANCRAGE){ const t=TAMPER.id; TAMPER.id=null; const N=await arbre(L);
    ANCRAGE={racine:N[N.length-1][0],date:new Date().toISOString().slice(0,10),tx:'0x'+(await sha('ancrage'+N[N.length-1][0])).slice(0,40)}; TAMPER.id=t; }
  const N=await arbre(L), i=L.findIndex(n=>n.id===SEL), f=N[0], p=preuve(N,i);
  let cur=f[i]; const et=[`Empreinte de la notice : <span class="hash">${court(cur)}</span>`];
  for(const s of p){ cur=await sha(s.cote==='droite'?cur+s.hash:s.hash+cur);
    et.push(`Combinée avec l'empreinte voisine de ${s.cote} <span class="hash">${court(s.hash)}</span> → <span class="hash">${court(cur)}</span>`); }
  const ok=cur===ANCRAGE.racine;

  app.innerHTML=`<div class="card"><h2>Preuve d'intégrité</h2>
    <p class="sub">Chaque notice est réduite à une empreinte SHA-256, combinées deux à deux jusqu'à une racine unique — seule valeur publiée. Tous les calculs de cet écran sont réels et s'exécutent dans votre navigateur.</p>
    <div class="rootbox"><div class="k">Racine ancrée le ${ANCRAGE.date} — ${L.length} notice(s)</div><div class="h">${ANCRAGE.racine}</div>
      <div class="k" style="margin-top:10px">Référence de transaction — simulée</div><div class="h" style="opacity:.65">${ANCRAGE.tx}</div></div>
    <p class="hint">Ni les notices, ni les images, ni aucune donnée nominative ne partent sur le registre public. Une racine par jour couvre toutes les notices produites ce jour-là.</p></div>
  <div class="two">
    <div class="card"><h2>Le registre</h2>
      ${L.map((n,k)=>`<div class="leaf"><span>${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''}${TAMPER.id===n.id?' <b style="color:var(--red)">— altérée</b>':''}</span><span class="h">${court(f[k])}</span></div>`).join('')}</div>
    <div class="card"><h2>Vérifier une notice</h2>
      <p class="sub">La preuve ne recalcule pas tout le registre : quelques empreintes voisines suffisent.</p>
      <select id="sel" style="margin-bottom:12px">${L.map(n=>`<option value="${n.id}" ${n.id===SEL?'selected':''}>${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''} — ${esc(n.intitule.slice(0,38))}…</option>`).join('')}</select>
      ${et.map((e,k)=>`<div class="step"><span class="i">${k+1}</span><span>${e}</span></div>`).join('')}
      <div class="verdict ${ok?'ok':'ko'}">${ok?"La racine recalculée correspond à la racine ancrée : la notice n'a pas été modifiée depuis.":"La racine recalculée ne correspond pas : le contenu a été modifié après l'ancrage."}</div></div></div>
  <div class="card"><h2>Altérer une notice pour voir</h2>
    <p class="sub">Modifiez le résumé, même d'un caractère, puis recalculez : l'empreinte change entièrement et la vérification échoue.</p>
    <textarea id="tam">${esc(TAMPER.id===SEL?TAMPER.text:(L[i].resume||"(cette notice n'a pas de résumé)"))}</textarea>
    <div class="actions"><button class="b" id="alt">Recalculer avec ce texte</button>
      ${TAMPER.id!==null?`<button class="b" id="res">Rétablir l'original</button>`:''}</div></div>
  <div class="card"><h2>Ce que cela prouve, et ce que cela ne prouve pas</h2>
    <div class="two" style="margin-top:6px">
      <div><h3 style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Prouvé</h3>
      <p style="font-size:14px;color:var(--ink2);margin:0">Qu'une notice existait sous cette forme exacte à la date d'ancrage, et n'a pas bougé depuis. Vérifiable par un tiers sans faire confiance aux Archives Nationales.</p></div>
      <div><h3 style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Non prouvé</h3>
      <p style="font-size:14px;color:var(--ink2);margin:0">Que la notice soit exacte, la transcription fidèle, l'acte authentique ou en vigueur. L'ancrage garantit la stabilité d'un contenu, jamais sa véracité.</p></div></div>
    <p class="hint" style="margin-top:16px">En préservation numérique, la même garantie s'obtient par les contrôles d'intégrité normalisés du modèle OAIS. L'ancrage public n'ajoute qu'une chose : la vérification sans dépendre de l'institution.</p></div>`;
  document.getElementById('sel').onchange=e=>{SEL=e.target.value;renderInteg()};
  document.getElementById('alt').onclick=()=>{TAMPER={id:SEL,text:document.getElementById('tam').value};renderInteg()};
  const r=document.getElementById('res'); if(r) r.onclick=()=>{TAMPER={id:null,text:null};renderInteg()};
}

  app.innerHTML=`<div class="recu"><div class="kicker">Encaissement constaté — simulation</div>

      :`<p style="font-size:14px;color:var(--ink2);margin:0">${OFFRE==='dossier'?'Le dossier sera constitué par un archiviste sous 7 jours ouvrés.':'Accès activé immédiatement.'}</p>`}
    <div class="actions">
      ${(OFFRE==='texte'||OFFRE==='scan')?`<button class="b" id="voir">Consulter dans la fiche</button>

      :`<button class="b pri" id="dl">Télécharger — ${OFFRE==='export'?FORMATS[FORMAT]:'texte'}</button>`}

      <button class="b" id="nv">Nouvelle commande</button></div>

      :'Le fichier livré contient la description archivistique, production propre des Archives Nationales. Les textes officiels restent libres.'} La présente quittance atteste de l\'encaissement par le Trésor public ; elle ne vaut pas facture commerciale.</p></div>`;
  document.getElementById('nv').onclick=()=>{ETAPE='choix';PROG=[];renderCmd()};
  const vo=document.getElementById('voir');
  if(vo) vo.onclick=()=>{ ouvert=[...PANIER][0]; ETAPE='choix'; PROG=[]; VUE='rech'; sync(); scrollTo(0,0); };

  if(mc) mc.onclick=()=>{ VUE='mescommandes'; ETAPE='choix'; PROG=[]; sync(); scrollTo(0,0); };
  const dl=document.getElementById('dl');
  if(dl) dl.onclick=()=>{
    const m=OFFRE!=='export'?['txt','text/plain',vJSON(S)]:FORMAT==='csv'?['csv','text/csv',vCSV(S)]:FORMAT==='akn'?['xml','application/xml',vAKN(S)]:FORMAT==='ric'?['jsonld','application/ld+json',vRIC(S)]:['json','application/json',vJSON(S)];
    tele(REF+'.'+m[0],m[2],m[1]+';charset=utf-8'); };
  const d=document.getElementById('dla');
  if(d) d.onclick=()=>tele(REF+'-attestation.txt',
`ARCHIVES NATIONALES DU CAMEROUN
ATTESTATION DE RECHERCHE — référence ${REF}

Il est attesté qu'une recherche a été menée le ${new Date().toLocaleDateString('fr-FR')}
dans le fonds décrit du Journal officiel.

Résultat : ${S.length} notice(s) répondant aux critères.

${S.map(n=>`  - ${n.type}${n.numero?' n° '+n.numero:''} du ${dfr(n.ds)} : ${n.intitule}`).join('\n')}

L'empreinte de la présente attestation est ancrée et vérifiable.
Un résultat négatif a la même valeur probante qu'un résultat positif.

Cette attestation porte sur l'état du dépouillement à la date indiquée
et ne préjuge pas de l'existence d'actes non encore décrits.
`,'text/plain;charset=utf-8');
}

// ══════════════════════════════════════════════════ 11. MES COMMANDES (chercheur)
function renderMesCommandes(){
  if(!UTILISATEUR) return vide("Connectez-vous pour voir vos commandes.");
  const mine=DB.commandes.filter(c=>c.acheteurId===UTILISATEUR.id).slice().reverse();
  if(!mine.length) return vide("Vous n'avez pas encore de commande. Passez par l'onglet Commander pour obtenir le texte intégral certifié d'un acte.");
  const L=OPAC();
  app.innerHTML=mine.map(c=>{
    const actes=c.actesIds.map(id=>L.find(n=>n.id===id)).filter(Boolean);
    const lib=c.statut==='validee'?'Validée — document disponible':c.statut==='refusee'?'Refusée':'En attente de validation par le directeur';
    const couleur=c.statut==='validee'?'#255536':c.statut==='refusee'?'var(--red)':'var(--ochre)';
    return `<div class="card"><h2>Commande ${esc(c.ref)}</h2>
      <p class="sub">${esc(dfr(c.dateCommande.slice(0,10)))} · ${esc((OFFRES[c.offre]||{}).t||c.offre)} · ${fcfa(c.montant)}</p>
      <p style="font-weight:600;color:${couleur};margin:0 0 10px">${lib}</p>
      ${c.statut==='refusee'&&c.motifRefus?`<p class="hint" style="color:var(--red);margin-bottom:10px">Motif du refus : ${esc(c.motifRefus)}</p>`:''}
      <table><tr><th>Type</th><th>Intitulé</th></tr>
      ${actes.map(n=>`<tr><td>${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''}</td><td>${esc(n.intitule.slice(0,60))}</td></tr>`).join('')}</table>
      ${c.statut==='validee'?`<div class="actions"><button class="b pri" data-dlc="${c.id}">Télécharger ${c.offre==='scan'?'le scan':'le texte intégral'} — PDF</button></div>`:''}
      ${c.statut==='refusee'?`<div class="actions"><button class="b" data-refaire="${c.id}">Passer une nouvelle commande</button></div>`:''}
    </div>`;
  }).join('');
  document.querySelectorAll('[data-dlc]').forEach(b=>b.onclick=()=>{
    const c=mine.find(x=>x.id===b.dataset.dlc); if(!c) return;
    const actes=c.actesIds.map(id=>L.find(n=>n.id===id)).filter(Boolean);
    if(c.offre==='scan') documentScan(actes, c.ref, 'Scan(s) original(aux) certifié(s) — reçu '+c.ref, c.validateur, c.dateValidation);
    else documentTexte(actes, c.ref, 'Texte(s) intégral(aux) certifié(s) — reçu '+c.ref, c.validateur, c.dateValidation);
  });
  document.querySelectorAll('[data-refaire]').forEach(b=>b.onclick=()=>{
    const c=mine.find(x=>x.id===b.dataset.refaire); if(!c) return;
    OFFRE=c.offre; PANIER=new Set(c.actesIds); ETAPE='choix'; PROG=[]; VUE='cmd'; sync(); scrollTo(0,0);
  });
}

function vCSV(L){ const c=['reference','numero','type','date_signature','date_publication','niveau','pages',
  'intitule_fr','intitule_en','resume_fr','resume_en','producteur_fr','producteur_en','autorite_fr','autorite_en',

  'conditions_acces','abroge','observation_commune_fr','observation_commune_en','observation_version_fr','observation_version_en'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return '\uFEFF'+[c.join(',')].concat(L.map(n=>[n.reference,n.numero,n.type,n.ds,n.dp,n.niveau,n.pages,
    n.P.intitule.fr,n.P.intitule.en,n.P.resume.fr,n.P.resume.en,n.P.producteur.fr,n.P.producteur.en,

    n.acces,n.abroge,n.P.notec.fr,n.P.notec.en,n.P.notes.fr,n.P.notes.en].map(q).join(','))).join('\n'); }

function vRIC(L){
  const id=s=>'anc:'+String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
  const agents=[...new Set(L.flatMap(n=>[...n.pers,...n.org,n.producteur].filter(Boolean)))];
  const concepts=[...new Set(L.flatMap(n=>n.th))];
  const places=[...new Set(L.flatMap(n=>n.geo))];
  const sets=[...new Set(L.map(n=>n.serie))].concat([...new Set(L.map(n=>n.numero_jo))]);
  return JSON.stringify({
    "@context":{"rico":"https://www.ica.org/standards/RiC/ontology#","anc":"https://archivesnationales.cm/id/",
      "rdfs":"http://www.w3.org/2000/01/rdf-schema#"},
    "@graph":[
      ...sets.map(s=>({"@id":id(s),"@type":"rico:RecordSet","rico:title":s,"rico:hasOrHadHolder":{"@id":"anc:archives-nationales-cameroun"}})),
      ...agents.map(a=>({"@id":id(a),"@type":"rico:Agent","rico:name":a})),
      ...concepts.map(c=>({"@id":id('concept-'+c),"@type":"rico:Thing","rdfs:label":c})),
      ...places.map(p=>({"@id":id('lieu-'+p),"@type":"rico:Place","rico:name":p})),
      ...L.map(n=>({
        "@id":id(n.reference||n.id),"@type":"rico:Record",
        "rico:title":[{"@value":n.P.intitule.fr,"@language":"fr"},{"@value":n.P.intitule.en,"@language":"en"}].filter(x=>x["@value"]),
        "rico:identifier":n.reference,
        "rico:descriptiveNote":[{"@value":n.P.resume.fr,"@language":"fr"},{"@value":n.P.resume.en,"@language":"en"}].filter(x=>x["@value"]),
        "rico:recordResourceExtent":n.importance||n.pages||null,
        "rico:hasDocumentaryFormType":n.type,
        "rico:isOrWasIncludedIn":[{"@id":id(n.serie)},{"@id":id(n.numero_jo)}],
        "rico:isAssociatedWithDate":[{"@type":"rico:SingleDate","rico:normalizedDateValue":n.ds,"rdfs:label":"signature"},
                                     {"@type":"rico:SingleDate","rico:normalizedDateValue":n.dp,"rdfs:label":"publication"}],
        "rico:hasCreator":n.producteur?{"@id":id(n.producteur)}:null,
        "rico:hasOrHadSubject":n.th.map(t=>({"@id":id('concept-'+t)})),
        "rico:isAssociatedWithPlace":n.geo.map(g=>({"@id":id('lieu-'+g)})),
        "rico:isOrWasAssociatedWithAgent":[...n.pers,...n.org].map(a=>({"@id":id(a)})),
        "rico:hasDerivedFromRecordResource":n.abroge?{"rdfs:label":n.abroge,"rdfs:comment":"relation d'abrogation relevée, non résolue"}:null,
        "rico:conditionsOfAccess":n.acces||null,
        "rico:authorizingAgent":n.autorite||null
      }))
    ]
  },null,2)
  +"\n";
}
