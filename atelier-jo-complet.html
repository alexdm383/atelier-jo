// ══════════════════════════════════════════════════ 5. COMPTES (admin seulement)
let editCompte=null;
function renderComptes(){
  app.innerHTML=`
  <div class="card"><h2>Comptes</h2>
    <p class="sub">Comptes de connexion à l'espace Administration. Rappel : ceci reste une connexion légère côté prototype — identifiants et mots de passe sont stockés tels quels dans ce fichier, ce n'est pas une sécurité réelle.</p>
    <table><tr><th>Identifiant</th><th>Rôle</th><th></th></tr>
    ${COMPTES.map(c=> c.id===editCompte ? `<tr><td><input id="ec-nom" value="${esc(c.nom)}" style="width:100%"></td>
        <td><select id="ec-role">${ROLES.map(([v,l])=>`<option value="${v}" ${v===c.role?'selected':''}>${esc(l)}</option>`).join('')}</select></td>
        <td><input id="ec-mdp" type="password" placeholder="nouveau mot de passe (facultatif)" style="width:100%"></td></tr>
        <tr><td colspan="3" style="padding-top:0"><button class="b pri" style="padding:3px 9px;font-size:12px" id="ec-ok">Enregistrer</button>
        <button class="b" style="padding:3px 9px;font-size:12px;margin-left:4px" id="ec-no">Annuler</button></td></tr>`
      : `<tr><td>${esc(c.nom)}</td><td>${esc((ROLES.find(r=>r[0]===c.role)||[,c.role])[1])}</td>
        <td><button class="b" style="padding:3px 9px;font-size:12px" data-mod="${c.id}">Modifier</button>
        <button class="b" style="padding:3px 9px;font-size:12px;margin-left:4px" data-sup="${c.id}">Supprimer</button></td></tr>`
    ).join('')}</table></div>

  <div class="card"><h2>Créer un compte</h2>
    <div class="row"><label class="lb">Identifiant</label><div><input id="nc-nom" placeholder="nom de l'agent"></div></div>
    <div class="row"><label class="lb">Rôle</label><div><select id="nc-role">${ROLES.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select></div></div>
    <div class="row"><label class="lb">Mot de passe</label><div><input id="nc-mdp" type="password"></div></div>
    <div id="nc-err" class="hint" style="color:var(--red)"></div>
    <div class="actions"><button class="b pri" id="nc-go">Créer</button></div></div>`;

  document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{ editCompte=b.dataset.mod; renderComptes(); });
  const okB=document.getElementById('ec-ok');
  if(okB) okB.onclick=async()=>{
    const c=COMPTES.find(x=>x.id===editCompte); if(!c) return;
    const nom=document.getElementById('ec-nom').value.trim(); if(!nom) return;
    c.nom=nom; c.role=document.getElementById('ec-role').value;
    const mdp=document.getElementById('ec-mdp').value; if(mdp) c.mdp=mdp;
    editCompte=null; await saveAuth();
    if(UTILISATEUR && UTILISATEUR.id===c.id){ UTILISATEUR={id:c.id,nom:c.nom,role:c.role}; await saveSession(); }
    renderComptes();
  };
  const noB=document.getElementById('ec-no'); if(noB) noB.onclick=()=>{ editCompte=null; renderComptes(); };
  document.querySelectorAll('[data-sup]').forEach(b=>b.onclick=async()=>{
    const c=COMPTES.find(x=>x.id===b.dataset.sup); if(!c) return;
    if(c.role==='admin' && COMPTES.filter(x=>x.role==='admin').length<=1){ alert("Impossible de supprimer le dernier compte administrateur."); return; }
    if(!confirm(`Supprimer le compte « ${c.nom} » ?`)) return;
    COMPTES=COMPTES.filter(x=>x.id!==c.id); await saveAuth();
    if(UTILISATEUR && UTILISATEUR.id===c.id) return logout();
    renderComptes();
  });
  document.getElementById('nc-go').onclick=async()=>{
    const nom=document.getElementById('nc-nom').value.trim(), mdp=document.getElementById('nc-mdp').value;
    const err=document.getElementById('nc-err');
    if(!nom||!mdp){ err.textContent='Identifiant et mot de passe requis.'; return; }
    if(COMPTES.some(x=>x.nom.toLowerCase()===nom.toLowerCase())){ err.textContent='Cet identifiant existe déjà.'; return; }
    COMPTES.push({id:idCompte(),nom,role:document.getElementById('nc-role').value,mdp});
    await saveAuth(); renderComptes();
  };
}

// ══════════════════════════════════════════════════ 6. COMMANDES (admin seulement — validation par le directeur)
let editRefus=null;
function renderCommandes(){
  const L=OPAC();
  const attente=DB.commandes.filter(c=>c.statut==='en_attente').slice().reverse();
  const traitees=DB.commandes.filter(c=>c.statut!=='en_attente').slice().reverse();
  app.innerHTML=`
  <div class="card"><h2>Commandes en attente de validation</h2>
    <p class="sub">Chaque commande de texte intégral ou de scan original doit être validée ici avant que l'acheteur puisse obtenir le document certifié — en-tête et tampon des Archives Nationales.</p>
    ${attente.length?'':'<p class="empty">Aucune commande en attente.</p>'}</div>
  ${attente.map(c=>{
    const actes=c.actesIds.map(id=>L.find(n=>n.id===id)).filter(Boolean);
    return `<div class="card"><h2>${esc(c.ref)} — ${esc(c.acheteurNom)}</h2>
      <p class="sub">${esc((OFFRES[c.offre]||{}).t||c.offre)} · ${esc(c.acheteurMail)} · ${esc(dfr(c.dateCommande.slice(0,10)))} · ${fcfa(c.montant)}</p>
      <table><tr><th>Type</th><th>Intitulé</th></tr>
      ${actes.map(n=>`<tr><td>${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''}</td><td>${esc(n.intitule.slice(0,60))}</td></tr>`).join('')}</table>
      ${editRefus===c.id?`<div class="row"><label class="lb">Motif du refus</label><div><textarea id="mr-${c.id}" placeholder="ex. paiement non confirmé, doublon…"></textarea></div></div>
        <div class="actions"><button class="b pri" data-refok="${c.id}">Confirmer le refus</button><button class="b" data-refno="${c.id}">Annuler</button></div>`
      :`<div class="actions"><button class="b pri" data-val="${c.id}">Valider</button><button class="b" data-ref="${c.id}">Refuser</button></div>`}
    </div>`;
  }).join('')}
  ${traitees.length?`<div class="card"><h2>Historique</h2>
    <table><tr><th>Référence</th><th>Acheteur</th><th>Statut</th><th>Par</th><th>Date</th></tr>
    ${traitees.map(c=>`<tr><td>${esc(c.ref)}</td><td>${esc(c.acheteurNom)}</td>
      <td>${c.statut==='validee'?'Validée':'Refusée'+(c.motifRefus?' — '+esc(c.motifRefus):'')}</td>
      <td>${esc(c.validateur||'—')}</td><td>${c.dateValidation?esc(dfr(c.dateValidation.slice(0,10))):'—'}</td></tr>`).join('')}
    </table></div>`:''}`;
  document.querySelectorAll('[data-val]').forEach(b=>b.onclick=async()=>{
    const c=DB.commandes.find(x=>x.id===b.dataset.val); if(!c) return;
    const cible=c.offre==='scan'?DB.achatsScan:DB.achats;
    c.actesIds.forEach(id=>{ if(!cible.includes(id)) cible.push(id); });
    c.statut='validee'; c.dateValidation=new Date().toISOString(); c.validateur=UTILISATEUR.nomComplet||UTILISATEUR.nom;
    await save(); renderCommandes();
  });
  document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{ editRefus=b.dataset.ref; renderCommandes(); });
  document.querySelectorAll('[data-refno]').forEach(b=>b.onclick=()=>{ editRefus=null; renderCommandes(); });
  document.querySelectorAll('[data-refok]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.refok, motif=document.getElementById('mr-'+id).value.trim();
    if(!motif){ alert('Un motif est requis pour refuser une commande.'); return; }
    const c=DB.commandes.find(x=>x.id===id); if(!c) return;
    c.statut='refusee'; c.motifRefus=motif; c.dateValidation=new Date().toISOString(); c.validateur=UTILISATEUR.nomComplet||UTILISATEUR.nom;
    editRefus=null; await save(); renderCommandes();
  });
}

// ══════════════════════════════════════════════════ ADRESSES ET NAVIGATION
let ROUTING=false;
function majURL(){
  if(ROUTING) return;
  let h='#/'+ESPACE+'/'+VUE;
  if(ESPACE==='opac'&&VUE==='rech'&&ouvert) h='#/notice/'+ouvert;
  else if(ESPACE==='opac'&&VUE==='rech'&&q) h+='?q='+encodeURIComponent(q);
  else if(ESPACE==='opac'&&VUE==='instr') h+='/'+INSTR+(INSTR==='guide'&&THEME?'/'+encodeURIComponent(THEME):'');
  if(location.hash!==h){ ROUTING=true; location.hash=h; setTimeout(()=>{ROUTING=false;},0); }
}
function lireURL(){
  if(ROUTING) return;
  const brut=location.hash.replace(/^#\/?/,''); if(!brut) return;
  const [chemin,qs]=brut.split('?');
  const p=chemin.split('/').filter(Boolean).map(decodeURIComponent);
  if(p[0]==='notice'&&p[1]){ ESPACE='opac'; VUE='rech'; ouvert=p[1]; }
  else if(p[0]==='admin'||p[0]==='opac'){
    ESPACE=p[0]; VUE=p[1]||TABS[ESPACE][0][0]; ouvert=null;
    if(VUE==='instr'&&p[2]){ INSTR=p[2]; if(p[3]) THEME=p[3]; }
  }
  if(qs){ const m=qs.match(/q=([^&]*)/); if(m) q=decodeURIComponent(m[1]); }
  ROUTING=true; sync(); ROUTING=false;
}
window.addEventListener('hashchange',lireURL);
const lien=id=>location.origin+location.pathname+'#/notice/'+id;

// ══════════════════════════════════════════════════ MOT DANS SON CONTEXTE
const ACC='àáâãäçèéêëìíîïñòóôõöùúûüýÿÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝ';
const SANS='aaaaaceeeeiiiinooooouuuuyyaaaaaceeeeiiiinooooouuuuy';
const norm1=s=>String(s||'').replace(/[\s\S]/g,c=>{const i=ACC.indexOf(c);return i<0?c.toLowerCase():SANS[i];});
function kwic(n,requete){
  const ts=norm1(requete).split(/\s+/).filter(x=>x.length>2);
  if(!ts.length) return '';
  const T=[n.intitule,n.resume,n.texte].filter(Boolean).join(' · ');
  const NT=norm1(T);
  let pos=-1,tk='';
  ts.forEach(t=>{ const i=NT.indexOf(t); if(i>=0&&(pos<0||i<pos)){pos=i;tk=t;} });
  if(pos<0) return '';
  const a=Math.max(0,pos-70), b=Math.min(T.length,pos+tk.length+110);
  const ext=(a>0?'… ':'')+T.slice(a,b)+(b<T.length?' …':'');
  const NE=norm1(ext), M=[];
  ts.forEach(t=>{ let i=NE.indexOf(t); while(i>=0){ M.push([i,i+t.length]); i=NE.indexOf(t,i+t.length); } });
  M.sort((x,y)=>x[0]-y[0]);
  let out='',last=0;
  M.forEach(([x,y])=>{ if(x<last) return; out+=esc(ext.slice(last,x))+'<mark>'+esc(ext.slice(x,y))+'</mark>'; last=y; });
  return out+esc(ext.slice(last));
}

// ══════════════════════════════════════════════════ ACCUEIL DU CATALOGUE
function renderAccueil(){
  const L=OPAC();
  if(!L.length) return vide("Le catalogue est vide. Passez par l'espace Administration, ou chargez le jeu de démonstration depuis l'onglet Données.");
  const S={}; L.forEach(n=>(S[n.serie] ||= []).push(n));
  const dec={}; L.forEach(n=>{ const y=(n.ds||'').slice(0,4); if(/^\d{4}$/.test(y)){ const d=Math.floor(+y/10)*10; dec[d]=(dec[d]||0)+1; } });
  const D=Object.keys(dec).map(Number).sort((a,b)=>a-b), max=Math.max(1,...Object.values(dec));
  const V={}; L.forEach(n=>n.th.forEach(t=>V[t]=(V[t]||0)+1));
  const top=Object.entries(V).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const recents=[...L].sort((a,b)=>(b.horodatage||'').localeCompare(a.horodatage||'')).slice(0,5);
  const complets=L.filter(n=>n.complet).length;

  app.innerHTML=`
  <div class="card" style="text-align:center;padding:34px 26px">
    <h2 style="font-size:26px">Fonds du Journal officiel du Cameroun</h2>
    <p class="sub" style="max-width:640px;margin:8px auto 20px">${t(`Instrument de recherche des Archives Nationales du Cameroun. ${L.length} pièce(s) décrite(s), ${bornes(L)}.`,`Finding aid of the National Archives of Cameroon. ${L.length} item(s) described, ${bornes(L)}.`)}</p>
    <div style="max-width:560px;margin:0 auto"><input id="qa" placeholder="Rechercher un acte, un nom, une matière…" value="${esc(q)}" style="font-size:16px;padding:12px 15px"></div>
    <div class="chips" style="justify-content:center;margin-top:14px">${top.slice(0,8).map(([t,c])=>`<span class="chip b" data-th="${esc(t)}">${esc(t)} <b style="font-family:var(--mono);font-size:11px">${c}</b></span>`).join('')}</div>
  </div>

  <div class="two">
    <div class="card"><h2>Les fonds</h2>
      <p class="sub">Cliquez sur une série pour la parcourir.</p>
      <table><tr><th>Série</th><th>Dates</th><th>Dossiers</th><th>Pièces</th></tr>
      ${Object.entries(S).map(([s,A])=>`<tr class="serie" data-serie="${esc(s)}" style="cursor:pointer">
        <td>${esc(s)}</td><td class="mono" style="font-size:12px">${bornes(A)}</td>
        <td class="num">${new Set(A.map(n=>n.numero_jo)).size}</td><td class="num">${A.length}</td></tr>`).join('')}</table>
    </div>
    <div class="card"><h2>État du dépouillement</h2>
      <p class="sub">Ce que le catalogue contient, et ce qu'il ne contient pas encore.</p>
      <div class="stats"><div class="stat"><div class="k">Pièces décrites</div><div class="v">${L.length}</div></div>
        <div class="stat"><div class="k">Descriptions complètes</div><div class="v">${Math.round(100*complets/L.length)} %</div></div>
        <div class="stat"><div class="k">Avec transcription</div><div class="v">${L.filter(n=>n.texte).length}</div></div></div>
      <p style="font-size:13px;color:var(--ink2);margin:14px 0 0">L'absence d'un acte au catalogue ne signifie pas qu'il n'existe pas : le dépouillement est en cours. Les périodes couvertes figurent ci-contre.</p>
    </div>
  </div>

  ${D.length?`<div class="card"><h2>Répartition chronologique</h2>
    <p class="sub">Par décennie de signature. Cliquez pour filtrer.</p>

// ══════════════════════════════════════════════════ 5. OPAC — RECHERCHE
let q='',F={type:new Set(),autorite:new Set(),annee:new Set(),th:new Set(),etat:new Set()},ouvert=null;
function corresp(n){
  if(q){ const h=norm([n.intitule,n.resume,n.numero,n.autorite,n.th.join(' '),n.geo.join(' '),n.pers.join(' '),n.org.join(' '),n.abroge].join(' '));
    if(!norm(q).split(/\s+/).filter(Boolean).every(t=>h.includes(t))) return false; }
  if(F.type.size&&!F.type.has(n.type))return false;
  if(F.autorite.size&&!F.autorite.has(n.autorite||'—'))return false;
  if(F.annee.size&&!F.annee.has((n.ds||'????').slice(0,4)))return false;
  if(F.etat.size&&!F.etat.has(n.complet?'Description complète':'Description à compléter'))return false;
  if(F.th.size&&!n.th.some(t=>F.th.has(t)))return false;
  return true;
}
function facette(k,lb,L){
  const m={}; L.forEach(n=>{ const v = k==='annee'?[(n.ds||'????').slice(0,4)] : k==='th'?n.th
    : k==='etat'?[n.complet?'Description complète':'Description à compléter'] : [n[k]||'—'];
    v.forEach(x=>m[x]=(m[x]||0)+1); });
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  if(!e.length) return '';
  return `<div class="fgrp"><h3>${lb}</h3>${e.map(([v,c])=>
    `<label class="fitem"><input type="checkbox" data-k="${k}" value="${esc(v)}" ${F[k].has(v)?'checked':''}><span>${esc(k==='type'?tType(v):v)}</span><span class="n">${c}</span></label>`).join('')}</div>`;
}
function renderRech(){
  const L=OPAC();
  if(!L.length) return vide("Le catalogue est vide. Passez par l'espace Administration pour indexer un numéro, ou chargez le jeu de démonstration depuis l'onglet Données.");
  if(ouvert!==null){ const n=L.find(x=>x.id===ouvert); if(n) return renderFiche(n); ouvert=null; }
  const R=L.filter(corresp), a=Object.values(F).reduce((s,x)=>s+x.size,0);
  app.innerHTML=`
  <div style="margin-bottom:18px"><input id="q" placeholder="Rechercher dans les intitulés, résumés, noms et descripteurs…" value="${esc(q)}" style="font-size:16px;padding:11px 14px"></div>
  <div class="layout"><aside>
    ${a?`<button class="clear" id="clr">Réinitialiser les ${a} filtres</button>`:''}
    ${facette('type',"Type d'acte",L)}${facette('annee','Année de signature',L)}
    ${facette('autorite','Autorité',L)}${facette('etat','État de la description',L)}${facette('th','Thème',L)}
  </aside><section>
    ${PANIER.size?`<div class="pan">${t(`Panier : ${PANIER.size} acte(s)`,`Selection: ${PANIER.size} act(s)`)}
      <button id="voirp">${t('Voir','View')}</button><button id="videp">${t('Vider','Clear')}</button></div>`:''}
    <div class="rescount">${t(`${R.length} notice(s) sur ${L.length}`,`${R.length} of ${L.length} description(s)`)}</div>
    ${R.length?R.map(n=>`<article class="hit" data-id="${n.id}">
      <div class="meta"><span>${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''}</span>
        ${n.ds?`<span>${t(`signé le ${dfr(n.ds)}`,`signed on ${dfr(n.ds)}`)}</span>`:''}
        ${ecart(n.ds,n.dp)>=6?`<b>${t(`publié ${ecart(n.ds,n.dp)} mois plus tard`,`published ${ecart(n.ds,n.dp)} months later`)}</b>`:''}
        ${!n.complet?`<b>${t('description à compléter','description to be completed')}</b>`:''}</div>
      <h3>${esc(n.intitule)}</h3>
      ${(()=>{const k=q?kwic(n,q):''; return k?`<p>${k}</p>`:(n.resume?`<p>${esc(n.resume.slice(0,180))}${n.resume.length>180?'…':''}</p>`:'');})()}
      <div class="chips">${n.th.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}
        <button class="addp" data-add="${n.id}" data-in="${PANIER.has(n.id)?1:0}">${PANIER.has(n.id)?'✓ au panier':'+ panier'}</button></div></article>`).join('')
    :'<div class="empty">Aucune notice ne correspond.</div>'}
  </section></div>`;
  const qi=document.getElementById('q');
  qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;renderRech();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('.fitem input').forEach(c=>c.onchange=()=>{const s=F[c.dataset.k];c.checked?s.add(c.value):s.delete(c.value);renderRech()});
  const cl=document.getElementById('clr'); if(cl) cl.onclick=()=>{Object.values(F).forEach(s=>s.clear());renderRech()};
  document.querySelectorAll('.hit').forEach(h=>h.onclick=e=>{ if(e.target.closest('.addp')) return; ouvert=h.dataset.id;renderRech();majURL();scrollTo(0,0)});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const i=b.dataset.add; PANIER.has(i)?PANIER.delete(i):PANIER.add(i); renderRech(); });
  const vp=document.getElementById('voirp'); if(vp) vp.onclick=()=>{ OFFRE='texte'; ETAPE='choix'; VUE='cmd'; sync(); scrollTo(0,0); };
  const dp=document.getElementById('videp'); if(dp) dp.onclick=()=>{ PANIER.clear(); renderRech(); };
}

        <dt>Données à caractère personnel</dt><dd>${perso?`${perso} personne(s) nommément désignée(s). Traitement effectué à des fins d'archivage dans l'intérêt public, hors champ de la loi n° 2024/017 — mais la diffusion publique reste soumise aux délais ci-dessus.`:'Aucune personne nommément désignée hors autorité signataire.'}</dd>

  const cp=document.getElementById('cop');
  if(cp) cp.onclick=()=>{ const t=lien(n.id);
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>{cp.textContent='Lien copié';},()=>{});
    else cp.textContent=t; };
  const pn=document.getElementById('pan');
  if(pn) pn.onclick=()=>{ PANIER.has(n.id)?PANIER.delete(n.id):PANIER.add(n.id); renderRech(); };
  const ac=document.getElementById('acheter');
  if(ac) ac.onclick=()=>{ OFFRE='texte'; PANIER=new Set([n.id]); ETAPE='choix'; PROG=[]; VUE='cmd'; sync(); scrollTo(0,0); };
  const dt=document.getElementById('dltxt');
  if(dt) dt.onclick=()=>{ const cv=commandeValidantActe(n.id,'texte');
    documentTexte([n], n.numero||n.id, 'Texte intégral certifié — '+(n.numero||n.reference), cv&&cv.validateur, cv&&cv.dateValidation); };
  const asc=document.getElementById('acheterScan');
  if(asc) asc.onclick=()=>{ OFFRE='scan'; PANIER=new Set([n.id]); ETAPE='choix'; PROG=[]; VUE='cmd'; sync(); scrollTo(0,0); };
  const dsc=document.getElementById('dlscan');
  if(dsc) dsc.onclick=()=>{ const cv=commandeValidantActe(n.id,'scan');
    documentScan([n], n.numero||n.id, 'Scan certifié — '+(n.numero||n.reference), cv&&cv.validateur, cv&&cv.dateValidation); };
}

// ══════════════════════════════════════════════════ PLAN DE CLASSEMENT (ISAD multi-niveaux)
function renderClassement(){
  const L=OPAC();
  if(!L.length) return vide("Le plan de classement se construit à partir des notices validées.");
  const T={};
  L.forEach(n=>{ (T[n.serie] ||= {})[n.numero_jo] ||= []; T[n.serie][n.numero_jo].push(n); });
  app.innerHTML=`<div class="card">
    <h2>Plan de classement</h2>
    <p class="sub">ISAD(G) impose la description à plusieurs niveaux, du général au particulier. Les trois niveaux ci-dessous sont déduits de la provenance des notices : fonds, série, unité documentaire, puis pièce.</p>
    <div style="font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding-bottom:8px;border-bottom:1px solid var(--rule)">${t(`Fonds — Journal officiel du Cameroun · ${L.length} pièce(s) décrite(s)`,`Fonds — Official Gazette of Cameroon · ${L.length} item(s) described`)}</div>
    ${Object.entries(T).map(([s,nums])=>{
      const tot=Object.values(nums).reduce((a,x)=>a+x.length,0);
      return `<div style="margin-top:16px">
        <div style="font-family:var(--serif);font-size:16px;padding-bottom:5px">${t('Série','Series')} — ${esc(tDict(s))} <span class="mono" style="font-size:11.5px;color:var(--ink3)">${t(`${tot} pièce(s)`,`${tot} item(s)`)}</span></div>
        ${Object.entries(nums).map(([num,A])=>`
          <div style="margin-left:18px;padding:8px 0 8px 14px;border-left:2px solid var(--rule)">
            <div style="font-size:14px;color:var(--ink2)">${t('Dossier','File')} — ${esc(num)} <span class="mono" style="font-size:11.5px;color:var(--ink3)">${t(`${A.length} acte(s)`,`${A.length} act(s)`)}</span></div>
            ${A.map(n=>`<div class="leaf" style="margin-left:10px;cursor:pointer" data-id="${n.id}">
              <span style="font-size:13.5px">${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''} — ${esc(n.intitule.slice(0,58))}</span>
              <span class="h">${esc(n.reference.slice(-28))}</span></div>`).join('')}
          </div>`).join('')}
      </div>`;}).join('')}
  </div>
  <div class="card"><h2>La limite de l'arborescence</h2>
    <p class="sub" style="margin-bottom:0">Un acte signé en 2022 et publié en 2024 appartient à deux ensembles à la fois ; un acte du Cameroun britannique relève de la <i>Nigeria Gazette</i> et de l'ordre juridique camerounais. L'arbre ISAD ne sait pas l'exprimer : il faut choisir un parent unique. C'est précisément ce que RiC résout en remplaçant l'arbre par un graphe — voir l'onglet Normes.</p></div>`;
  document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{VUE='rech';ouvert=x.dataset.id;sync();scrollTo(0,0)});
}

// ══════════════════════════════════════════════════ INSTRUMENTS DE RECHERCHE
let INSTR='etat', IRLANG='bi';
const INSTRUMENTS={
 etat:["État des fonds","Vue d'ensemble des fonds conservés : séries, dates extrêmes, volume et avancement du dépouillement. Instrument d'orientation, premier niveau de description."],
 repertoire:["Répertoire numérique détaillé","Énumération dans l'ordre des cotes, du général au particulier, sans analyse du contenu. Instrument de repérage."],
 inventaire:["Inventaire analytique","Analyse pièce à pièce avec résumé et points d'accès. C'est l'instrument que produit le dépouillement, et le cœur de la valeur ajoutée."],
 index:["Index","Index des matières, des personnes et des lieux, renvoyant aux cotes. Instrument d'accès transversal, indépendant du plan de classement."],
 chronologique:["Table chronologique","Classement par date de signature, distincte de la date de publication. Indispensable sur ce corpus."],
 concordance:["Table de concordance","Correspondance entre numéro d'acte, cote et numéro du Journal officiel. Nécessaire du fait de l'hétérogénéité des numérotations."],
 methodique:["Répertoire méthodique","Le corpus entier regroupé par matière et non par cote. Instrument d'accès thématique sur l'ensemble du fonds."],
 guide:["Guide thématique","État des sources sur une question donnée : actes retenus, répartition chronologique, termes associés et silences du fonds. C'est le dossier documentaire que les Archives peuvent délivrer."]
};
let THEME='';
const alpha=(a,b)=>a.localeCompare(b,'fr');
const bi=(n,k)=>{ const p=n.P&&n.P[k]; if(!p) return n[k]||'';
  if(IRLANG==='fr') return p.fr||p.en||'';
  if(IRLANG==='en') return p.en||p.fr||'';
  return [p.fr,p.en].filter(Boolean).join('  /  ')||''; };

function bornes(L){ const d=L.map(n=>n.ds).filter(x=>/^\d{4}/.test(x)).sort();
  return d.length?`${d[0].slice(0,4)}-${d[d.length-1].slice(0,4)}`:'sans date'; }

function corpsInstr(kind,L){
  const R=[];  // [type, ...] : 'h' titre, 'p' paragraphe, 't' tableau [entêtes, lignes]
  if(kind==='etat'){
    const S={}; L.forEach(n=>(S[n.serie] ||= []).push(n));
    R.push(['t',[['Série','Dates extrêmes','Dossiers','Pièces décrites','Avec transcription'],
      Object.entries(S).map(([s,A])=>[s,bornes(A),String(new Set(A.map(n=>n.numero_jo)).size),String(A.length),String(A.filter(n=>n.texte).length)])]]);
    R.push(['p',`Fonds : Journal officiel du Cameroun. Producteur : Présidence de la République et administrations émettrices. Institution de conservation : Archives Nationales du Cameroun. Total décrit : ${L.length} pièce(s), dates extrêmes ${bornes(L)}.`]);
  }
  if(kind==='repertoire'){
    const S={}; L.forEach(n=>{ (S[n.serie] ||= {})[n.numero_jo] ||= []; S[n.serie][n.numero_jo].push(n); });
    Object.entries(S).forEach(([s,N])=>{ R.push(['h',`Série — ${s}`]);
      Object.entries(N).forEach(([num,A])=>{ R.push(['h2',`Unité documentaire — ${num}`]);
        R.push(['t',[['Cote','Intitulé','Dates','Importance'],
          A.map(n=>[n.reference,bi(n,'intitule'),n.ds?dfr(n.ds):'sans date',n.importance||(n.pages?'p. '+n.pages:'—')])]]); }); });
  }
  if(kind==='inventaire'){
    [...L].sort((a,b)=>(a.ds||'').localeCompare(b.ds||'')).forEach(n=>{
      R.push(['h',`${n.reference} — ${tType(n.type,IRLANG)}${n.numero?' n° '+n.numero:''}`]);
      R.push(['p',bi(n,'intitule')]);
      R.push(['t',[['Élément','Valeur'],[
        ['Dates',`signature ${dfr(n.ds)} · publication ${dfr(n.dp)}`],
        ['Niveau de description',tNiveau(n.niveau,IRLANG)],
        ['Producteur',n.producteur||'—'],
        ['Importance matérielle',n.importance||(n.pages?'p. '+n.pages:'—')],
        ['Présentation du contenu',bi(n,'resume')||'non établie'],
        ['Conditions d\'accès',n.acces||'Librement communicable'],
        ['Matières',n.th.join(' ; ')||'—'],
        ['Personnes',n.pers.join(' ; ')||'—'],
        ['Lieux',n.geo.join(' ; ')||'—'],
        ['Organismes',n.org.join(' ; ')||'—'],
        ['Sources complémentaires',[n.abroge&&'abroge '+n.abroge,n.modifies&&'modifie '+n.modifies,n.vises&&'vise '+n.vises].filter(Boolean).join(' ; ')||'—'],
        ['Observation commune',bi(n,'notec')||'—'],
        ['Observation version française',n.P.notes.fr||'—'],
        ['Observation English version',n.P.notes.en||'—']]]]);
    });
  }
  if(kind==='index'){
    [['th','Index des matières'],['pers','Index des personnes'],['geo','Index des lieux'],['org','Index des organismes']].forEach(([k,t])=>{
      const M={}; L.forEach(n=>n[k].forEach(v=>(M[v] ||= []).push(n)));
      const E=Object.keys(M).sort(alpha);
      R.push(['h',`${t} — ${E.length} entrée(s)`]);
      R.push(['t',[['Vedette','Renvois'],E.map(v=>[v,M[v].map(n=>n.reference).join(' ; ')])]]);
    });
  }
  if(kind==='chronologique'){
    R.push(['t',[['Date de signature','Acte','Date de publication','Écart','Cote'],
      [...L].sort((a,b)=>(a.ds||'').localeCompare(b.ds||'')).map(n=>
        [dfr(n.ds),`${tType(n.type,IRLANG)}${n.numero?' n° '+n.numero:''} — ${bi(n,'intitule').slice(0,70)}`,dfr(n.dp),
         ecart(n.ds,n.dp)?ecart(n.ds,n.dp)+' mois':'—',n.reference])]]);
    R.push(['p',"Le classement chronologique se fait sur la date de signature. Le classement par date de publication rassemblerait des actes signés à plusieurs années d'écart et rendrait la recherche par période inopérante."]);
  }
  if(kind==='concordance'){
    R.push(['t',[["Numéro d'acte",'Type','Cote','Numéro du Journal officiel','Pages'],
      [...L].sort((a,b)=>alpha(a.numero||'zzz',b.numero||'zzz')).map(n=>
        [n.numero||'non relevé',n.type,n.reference,n.numero_jo,n.pages||'—'])]]);
    R.push(['p',"Les numérotations diffèrent entre les versions française et anglaise et entre les autorités émettrices. Cette table fixe la forme normalisée retenue par les Archives Nationales."]);
  }
  if(kind==='methodique'){
    const principale=n=>n.th[0]||'[sans descripteur]';
    const P={}; L.forEach(n=>(P[principale(n)] ||= []).push(n));
    R.push(['p',`${Object.keys(P).length} rubrique(s) pour ${L.length} acte(s), sans doublon. Chaque acte est classé une seule fois, sous sa vedette principale — le premier descripteur retenu par l'archiviste. Les autres matières donnent lieu à des renvois et jamais à une seconde entrée : un répertoire est un classement, un index est un accès.`]);
    Object.keys(P).sort(alpha).forEach(v=>{ const A=P[v];
      R.push(['h',`${v} — ${A.length} acte(s), ${bornes(A)}`]);
      R.push(['t',[['Cote','Acte','Date de signature','Intitulé','Autres matières'],
        [...A].sort((a,b)=>(a.ds||'').localeCompare(b.ds||'')).map(n=>
          [n.reference,`${tType(n.type,IRLANG)}${n.numero?' n° '+n.numero:''}`,dfr(n.ds),bi(n,'intitule'),n.th.slice(1).join(' ; ')||'—'])]]);
      const ailleurs=L.filter(n=>principale(n)!==v && n.th.includes(v));
      if(ailleurs.length) R.push(['p',`Voir aussi, relevant de cette matière mais classés ailleurs : ${ailleurs.map(n=>`${n.reference} (sous « ${principale(n)} »)`).join(' ; ')}.`]);
    });
  }
  if(kind==='guide'){
    const A=L.filter(n=>n.th.includes(THEME));
    if(!A.length){ R.push(['p',"Aucun acte du catalogue n'est indexé sous cette vedette."]); return R; }
    const S={}; A.forEach(n=>(S[n.serie] ||= []).push(n));
    const seriesTotal=[...new Set(L.map(n=>n.serie))];
    const muettes=seriesTotal.filter(s=>!S[s]);
    const assoc={}; A.forEach(n=>n.th.forEach(t=>{ if(t!==THEME) assoc[t]=(assoc[t]||0)+1; }));
    const co=Object.entries(assoc).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const pers=[...new Set(A.flatMap(n=>n.pers))], geo=[...new Set(A.flatMap(n=>n.geo))];

    R.push(['h','Objet et périmètre']);
    R.push(['p',`Le présent guide recense les actes du Journal officiel du Cameroun indexés sous la vedette « ${THEME} ». Il en compte ${A.length} sur les ${L.length} décrits, répartis sur ${Object.keys(S).length} série(s), dates extrêmes ${bornes(A)}. Il ne modifie pas le classement du fonds : chaque renvoi se fait à la cote d'origine.`]);

    R.push(['h','Répartition par série et par ordre chronologique']);
    Object.entries(S).forEach(([s,B])=>{
      R.push(['h2',`${s} — ${B.length} acte(s), ${bornes(B)}`]);
      R.push(['t',[['Cote','Date de signature','Acte','Analyse'],
        [...B].sort((a,b)=>(a.ds||'').localeCompare(b.ds||'')).map(n=>
          [n.reference,dfr(n.ds),`${tType(n.type,IRLANG)}${n.numero?' n° '+n.numero:''}`,bi(n,'resume')||bi(n,'intitule')])]]);
    });

    if(co.length){ R.push(['h','Termes associés']);
      R.push(['p',"Vedettes apparaissant conjointement dans les mêmes actes. Elles constituent le point de départ du regroupement en concepts pérennes et en termes d'époque."]);
      R.push(['t',[['Vedette associée','Occurrences conjointes'],co.map(([t,c])=>[t,String(c)])]]); }

    if(pers.length||geo.length){ R.push(['h','Personnes et lieux rencontrés']);
      R.push(['t',[['Catégorie','Vedettes'],[['Personnes',pers.join(' ; ')||'—'],['Lieux',geo.join(' ; ')||'—']]]]); }

    R.push(['h','Silences du fonds']);
    R.push(['p', muettes.length
      ? `Aucun acte indexé sous cette vedette n'a été repéré dans : ${muettes.join(' ; ')}. Ce silence peut tenir à l'absence effective de textes, à une lacune du fonds conservé, ou à un dépouillement encore partiel. En l'état du traitement, il ne peut être interprété comme une absence de sources.`
      : "Toutes les séries décrites comportent au moins un acte sous cette vedette. Cela ne préjuge pas de l'exhaustivité du dépouillement."]);
    R.push(['p',"L'indication des silences fait partie de l'instrument : un résultat négatif documenté a la même valeur pour le chercheur qu'un résultat positif."]);
  }
  return R;
}

// ---- index propres à chaque instrument, calculés sur son seul contenu ----
function indexSimple(A,k,titre){
  const M={}; A.forEach(n=>n[k].forEach(v=>(M[v] ||= new Set()).add(n.reference)));
  const E=Object.keys(M).sort(alpha); if(!E.length) return [];
  return [['h',`${titre} — ${E.length} entrée(s)`],
    ['t',[['Vedette','Renvois aux cotes'],E.map(v=>[v,[...M[v]].sort(alpha).join(' ; ')])]]];
}
function indexMatieres(A){
  const M={},CO={};
  A.forEach(n=>n.th.forEach(v=>{ (M[v] ||= new Set()).add(n.reference);
    n.th.forEach(w=>{ if(w!==v){ (CO[v] ||= {}); CO[v][w]=(CO[v][w]||0)+1; } }); }));
  const E=Object.keys(M).sort(alpha); if(!E.length) return [];
  return [['h',`Index des matières — ${E.length} entrée(s)`],
    ['t',[['Vedette','Voir aussi','Renvois aux cotes'],
      E.map(v=>[v,
        Object.entries(CO[v]||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(' ; ')||'—',
        [...M[v]].sort(alpha).join(' ; ')])]]];
}
function indexCotes(A){
  const E=[...A].sort((a,b)=>alpha(a.reference,b.reference));
  return [['h',`Index des cotes — ${E.length} entrée(s)`],
    ['t',[['Cote','Vedette principale','Matières secondaires'],
      E.map(n=>[n.reference,n.th[0]||'[sans descripteur]',n.th.slice(1).join(' ; ')||'—'])]]];
}
function indexChrono(A){
  const M={}; A.forEach(n=>{ const y=(n.ds||'').slice(0,4)||'sans date'; (M[y] ||= []).push(n.reference); });
  const E=Object.keys(M).sort(alpha);
  return [['h',`Index chronologique — ${E.length} année(s)`],
    ['t',[['Année de signature','Renvois aux cotes'],E.map(y=>[y,M[y].sort(alpha).join(' ; ')])]]];
}

function indexPour(kind,L){
  const A = kind==='guide' ? L.filter(n=>n.th.includes(THEME)) : L;
  if(!A.length) return [];
  const tete=[['h','Index de l\'instrument'],
    ['p',"Les index ci-dessous sont calculés sur le seul contenu de cet instrument et renvoient à ses propres cotes. Ils le rendent utilisable de façon autonome, hors de toute base de données."]];
  const P=()=>indexSimple(A,'pers','Index des personnes'), G=()=>indexSimple(A,'geo','Index des lieux'),
        O=()=>indexSimple(A,'org','Index des organismes');
  if(kind==='etat') return [['h','Index de l\'instrument'],
    ['p',"L'état des fonds ne comporte pas d'index : il est lui-même un instrument d'orientation, au niveau du fonds et de la série. Les index figurent dans le répertoire et l'inventaire."]];
  if(kind==='concordance') return [['h','Index de l\'instrument'],
    ['p',"La table de concordance est elle-même un index : elle donne accès par le numéro d'acte. Un second index serait redondant."]];
  if(kind==='index') return [];
  if(kind==='methodique') return [...tete,...indexCotes(A),...P(),...G(),...O(),...indexChrono(A)];
  if(kind==='guide') return [...tete,...P(),...G(),...O(),...indexChrono(A)];
  if(kind==='chronologique') return [...tete,...indexMatieres(A),...P(),...G()];
  return [...tete,...indexMatieres(A),...P(),...G(),...O(),...indexChrono(A)];
}

// ---- Générateur .docx minimal, sans bibliothèque : un fichier .doc « HTML déguisé » (essayé en
// premier) se heurte à une limite pratique du filtre d'import de Word sur les gros documents — le
// contenu se coupait en cours de route sur un instrument tiré d'un fonds volumineux. Un vrai .docx
// (conteneur ZIP + XML WordprocessingML, le format natif de Word) n'a pas cette limite. Le ZIP est
// écrit ici en mode « stored » (non compressé) : plus simple et fiable à composer à la main qu'un
// compresseur DEFLATE, au prix d'un fichier un peu plus lourd — sans conséquence pour ces volumes.
const CRC_TABLE=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t; })();
function crc32(bytes){ let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
const utf8=s=>new TextEncoder().encode(s);
const u16=v=>[v&255,(v>>8)&255];
const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
function dosDateHeure(){ const d=new Date();
  return { t:((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((d.getSeconds()>>1)&31),
    d:(((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31) }; }
function creerZip(fichiers){
  const {t:dt,d:dd}=dosDateHeure();
  const locaux=[], centrale=[]; let offset=0;
  fichiers.forEach(f=>{
    const nom=utf8(f.nom), data=f.data, crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(dt),...u16(dd),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(nom.length),...u16(0)]);
    locaux.push(new Uint8Array([...lh,...nom,...data]));
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(dt),...u16(dd),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(nom.length),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(0),...u32(offset)]);
    centrale.push(new Uint8Array([...ch,...nom]));
    offset+=lh.length+nom.length+data.length;
  });
  const tailleCentrale=centrale.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(fichiers.length),...u16(fichiers.length),
    ...u32(tailleCentrale),...u32(offset),...u16(0)]);
  return new Blob([...locaux,...centrale,eocd],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const escXml=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wPara(texte,o){ o=o||{};
  const pprBits=[]; if(o.avant!=null||o.apres!=null) pprBits.push(`<w:spacing w:before="${o.avant||0}" w:after="${o.apres||0}"/>`);
  if(o.bordureBas) pprBits.push('<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="4" w:color="999999"/></w:pBdr>');
  const ppr=pprBits.length?`<w:pPr>${pprBits.join('')}</w:pPr>`:'';
  const rprBits=[]; if(o.gras) rprBits.push('<w:b/>');
  if(o.taille) rprBits.push(`<w:sz w:val="${o.taille}"/><w:szCs w:val="${o.taille}"/>`);
  if(o.couleur) rprBits.push(`<w:color w:val="${o.couleur}"/>`);
  const rpr=rprBits.length?`<w:rPr>${rprBits.join('')}</w:rPr>`:'';
  return `<w:p>${ppr}<w:r>${rpr}<w:t xml:space="preserve">${escXml(texte)}</w:t></w:r></w:p>`;
}
function wParaCell(texte,gras){
  return `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr><w:r><w:rPr>${gras?'<w:b/>':''}<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve">${escXml(texte)}</w:t></w:r></w:p>`;
}
function wTable(entetes,lignes,o){ o=o||{};
  const nbCols=(entetes||lignes[0]||['']).length, largeurCol=Math.floor(9026/Math.max(nbCols,1));
  const grille=`<w:tblGrid>${Array(nbCols).fill(0).map(()=>`<w:gridCol w:w="${largeurCol}"/>`).join('')}</w:tblGrid>`;
  const tblPr=`<w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="BBBBBB"/><w:left w:val="single" w:sz="4" w:color="BBBBBB"/><w:bottom w:val="single" w:sz="4" w:color="BBBBBB"/><w:right w:val="single" w:sz="4" w:color="BBBBBB"/><w:insideH w:val="single" w:sz="4" w:color="BBBBBB"/><w:insideV w:val="single" w:sz="4" w:color="BBBBBB"/></w:tblBorders></w:tblPr>`;
  const cell=(texte,gras,ombre)=>`<w:tc><w:tcPr><w:tcW w:w="${largeurCol}" w:type="dxa"/>${ombre?'<w:shd w:val="clear" w:fill="EEEEEE"/>':''}</w:tcPr>${wParaCell(texte,gras)}</w:tc>`;
  const ligneEntete=entetes?`<w:tr>${entetes.map(h=>cell(h,true,true)).join('')}</w:tr>`:'';
  const lignesXml=lignes.map(r=>`<w:tr>${r.map((c,i)=>cell(c,!!(o.grasCol0&&i===0),false)).join('')}</w:tr>`).join('');
  return `<w:tbl>${tblPr}${grille}${ligneEntete}${lignesXml}</w:tbl>`;
}
function corpsDocxBlocs(R){
  return R.map(b=>{
    if(b[0]==='h') return wPara(b[1],{gras:true,taille:26,avant:280,apres:100,bordureBas:true});
    if(b[0]==='h2') return wPara(b[1],{taille:22,avant:160,apres:60,couleur:'444444'});
    if(b[0]==='p') return wPara(b[1],{taille:21,apres:100});
    return wTable(b[1][0],b[1][1]);
  }).join('');
}
function genererDocx(titrePage,tp,som,R,pied){
  const corps=[
    wPara(titrePage,{gras:true,taille:32,apres:120}),
    wTable(null,tp,{grasCol0:true}),
    ...(som.length?[wPara('Sommaire',{gras:true,taille:24,avant:220,apres:80}),...som.map(s=>wPara('•  '+s,{taille:21,apres:40}))]:[]),
    corpsDocxBlocs(R),
    wPara(pied,{taille:16,couleur:'666666',avant:320})
  ].join('');
  const sectPr='<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${corps}${sectPr}</w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;
  const relsRoot=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
  const relsDoc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia" w:cs="Georgia"/><w:sz w:val="21"/></w:rPr></w:rPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
</w:styles>`;
  return creerZip([
    {nom:'[Content_Types].xml',data:utf8(contentTypes)},
    {nom:'_rels/.rels',data:utf8(relsRoot)},
    {nom:'word/document.xml',data:utf8(documentXml)},
    {nom:'word/_rels/document.xml.rels',data:utf8(relsDoc)},
    {nom:'word/styles.xml',data:utf8(styles)},
  ]);
}

function renderInstr(){
  const L=OPAC();
  if(!L.length) return vide("Les instruments de recherche se construisent à partir des notices validées.");
  const VED={}; L.forEach(n=>n.th.forEach(t=>VED[t]=(VED[t]||0)+1));
  const vedettes=Object.keys(VED).sort((a,b)=>VED[b]-VED[a]||alpha(a,b));
  if(INSTR==='guide' && (!THEME||!VED[THEME])) THEME=vedettes[0]||'';
  const [titre,desc]=INSTRUMENTS[INSTR];
  const R=corpsInstr(INSTR,L).concat(indexPour(INSTR,L));
  const modes={fr:'Français',en:'English',bi:'Bilingue / Bilingual'};
  const complet=L.every(n=>n.complet);
  const html=R.map(b=>{
    if(b[0]==='h') return `<h3 id="s${R.indexOf(b)}" style="font-family:var(--serif);font-size:16px;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--ruleS);text-transform:none;letter-spacing:0;color:var(--ink)">${esc(b[1])}</h3>`;
    if(b[0]==='h2') return `<div style="font-size:14px;color:var(--ink2);margin:14px 0 4px">${esc(b[1])}</div>`;
    if(b[0]==='p') return `<p style="font-size:14px;color:var(--ink2);margin:10px 0">${esc(b[1])}</p>`;
    return `<table><tr>${b[1][0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr>
      ${b[1][1].map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="mono" style="white-space:nowrap"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
  }).join('');

  app.innerHTML=`
  <div class="card"><h2>Instruments de recherche</h2>
    <p class="sub">Un service d'archives ne diffuse pas des écrans, il produit des instruments : documents normalisés, datés, signés et citables. Les huit ci-dessous se génèrent à partir du catalogue, chacun accompagné de ses propres index.</p>
    <div class="offers">${Object.entries(INSTRUMENTS).map(([k,[t,d]])=>
      `<div class="offer" data-i="${k}" data-on="${INSTR===k?1:0}"><div class="t">${t}</div><div class="d">${d}</div></div>`).join('')}</div></div>

  <div class="card" style="border-left:3px solid var(--blue)">
    ${INSTR==='guide'?`<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--rule)">
      <div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px">Vedette traitée</div>
      <select id="ved">${vedettes.map(v=>`<option ${v===THEME?'selected':''}>${esc(v)} — ${VED[v]} acte(s)</option>`).join('')}</select></div>`:''}
    <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--rule)">
      <div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px">Langue de l'instrument</div>
      <div class="seg" style="display:inline-flex">${Object.entries(modes).map(([k,v])=>`<button data-ir="${k}" aria-pressed="${IRLANG===k}" style="font:inherit;font-size:13px;border:0;background:${IRLANG===k?'var(--ink)':'#fff'};color:${IRLANG===k?'#fff':'var(--ink2)'};padding:6px 14px;cursor:pointer">${v}</button>`).join('')}</div>
      <p class="hint">Le mode bilingue restitue les deux colonnes côte à côte, conformément à la publication du Journal officiel.</p></div>
    <div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">Page de titre — contrôle de la description, ISAD(G) zone 7</div>
    <h2 style="font-size:20px">${esc(titre)}${INSTR==='guide'&&THEME?` — ${esc(THEME)}`:''}</h2>
    <dl class="dl" style="margin-top:12px">
      <dt>Fonds</dt><dd>Journal officiel du Cameroun</dd>
      <dt>Institution</dt><dd>Archives Nationales du Cameroun</dd>
      <dt>Dates extrêmes</dt><dd>${bornes(L)}</dd>
      <dt>Importance matérielle</dt><dd>${L.length} pièce(s) décrite(s)</dd>
      <dt>Rédacteur</dt><dd>${esc([...new Set(L.map(n=>n.annotateur).filter(Boolean))].join(', ')||'non renseigné')}</dd>
      <dt>Date d'élaboration</dt><dd>${new Date().toLocaleDateString('fr-FR')}</dd>
      <dt>Règles appliquées</dt><dd>ISAD(G) 2<sup>e</sup> éd. · RiC-CM · ISO 15489 · loi n° 2024/001 du 24 juillet 2024</dd>
      <dt>État de l'instrument</dt><dd style="${complet?'':'color:var(--ochre)'}">${complet?'Définitif':'Provisoire — certaines descriptions restent à compléter'}</dd>
    </dl>
    <div class="actions"><button class="b pri" id="dl">Télécharger l'instrument — Word</button></div>
  </div>

  <div class="card">${html}</div>

  <div class="card"><h2>Principes appliqués</h2>
    <div style="font-size:13.5px;color:var(--ink2);line-height:1.8">
      <b>Respect des fonds.</b> Les actes ne sont jamais regroupés par thème dans le classement : ils restent rattachés à la série et au numéro qui les ont produits. Le thème est une clé d'accès, pas un principe de rangement.<br>
      <b>Ordre originel.</b> Le répertoire suit l'ordre des cotes, non l'ordre de saisie ni la pertinence d'une recherche.<br>
      <b>Description du général au particulier.</b> État des fonds, puis répertoire, puis inventaire : trois niveaux de finesse pour un même ensemble.<br>
      <b>Non-répétition.</b> La provenance est portée une fois par la série et l'unité documentaire, pas répétée dans chaque notice.<br>
      <b>Une pièce, une place.</b> Dans le répertoire méthodique, chaque acte est classé une seule fois, sous sa vedette principale ; les autres matières donnent lieu à des renvois. Répéter l'entrée sous chaque descripteur ferait un index, pas un répertoire — et gonflerait artificiellement le volume de l'instrument.<br>
      <b>Indépendance des instruments thématiques.</b> Le respect des fonds gouverne le classement, non les instruments. Index, répertoire méthodique et guide thématique traversent librement le plan de classement parce qu'ils ne déplacent rien : ils renvoient toujours à la cote d'origine. Ce sont des couches d'accès, pas des rangements concurrents.<br>
      <b>Signalement des silences.</b> Un guide thématique indique où le fonds est muet. Un résultat négatif documenté vaut, pour le chercheur, autant qu'un résultat positif.<br>
      <b>Datation et signature de l'instrument.</b> Un instrument de recherche engage son rédacteur et porte son état, provisoire ou définitif.</div></div>`;

  document.querySelectorAll('[data-i]').forEach(o=>o.onclick=()=>{INSTR=o.dataset.i;renderInstr();scrollTo(0,0)});
  document.querySelectorAll('[data-ir]').forEach(o=>o.onclick=()=>{IRLANG=o.dataset.ir;renderInstr()});
  const vd=document.getElementById('ved');
  if(vd) vd.onchange=()=>{ THEME=vd.value.split(' — ')[0]; renderInstr(); };
  document.getElementById('dl').onclick=()=>{
    const titre2 = titre + (INSTR==='guide'&&THEME?` — ${THEME}`:'');
    const tp=[['Fonds','Journal officiel du Cameroun'],['Institution','Archives Nationales du Cameroun'],
      ['Dates extrêmes',bornes(L)],['Importance',`${L.length} pièce(s) décrite(s)`],
      ['Rédacteur',[...new Set(L.map(n=>n.annotateur).filter(Boolean))].join(', ')||'non renseigné'],
      ['Date',new Date().toLocaleDateString('fr-FR')],
      ['Règles','ISAD(G) 2e éd. — RiC-CM — ISO 15489 — loi n° 2024/001 du 24 juillet 2024'],
      ['État',complet?'Définitif':'Provisoire']];
    const som=R.filter(b=>b[0]==='h').map(b=>b[1]);
    const pied="Instrument de recherche établi par les Archives Nationales du Cameroun. La communication des documents décrits s'effectue sous le régime des articles 21 et 22 de la loi n° 2024/001. Seule la version publiée au Journal officiel fait foi.";
    const blob=genererDocx(titre2,tp,som,R,pied);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=INSTR+'-journal-officiel.docx';
    a.click(); URL.revokeObjectURL(a.href);
  };
}

function renderNormes(){

  app.innerHTML=`
  <div class="card"><h2>Conformité aux normes</h2>

      <div class="stat"><div class="k">SIP en attente</div><div class="v">${nq}</div></div>
      <div class="stat"><div class="k">DIP délivrés</div><div class="v">${na}</div></div></div></div>

  <div class="card"><h2>ISAD(G) — description archivistique</h2>
    <p class="sub">Norme générale et internationale de description, Conseil International des Archives.</p>
    <table><tr><th>Exigence</th><th>Où</th><th>État</th></tr>

      <tr><td>${t('Éléments obligatoires : référence, intitulé, dates, niveau, producteur','Mandatory elements: reference, title, dates, level, creator')}</td><td>${t('Zone 1 et zone 2','Area 1 and area 2')}</td><td>${t(`${compl} % renseignés`,`${compl}% completed`)}</td></tr>
      <tr><td>Description à plusieurs niveaux</td><td>Onglet Plan de classement</td><td>Fonds, série, unité, pièce</td></tr>
      <tr><td>Non-répétition entre niveaux</td><td>Provenance portée par la séance</td><td>Appliqué</td></tr>
      <tr><td>Histoire administrative du producteur — ISAAR(CPF)</td><td>—</td><td>À construire : notices d'autorité distinctes</td></tr></table></div>

  <div class="card"><h2>RiC — Records in Contexts</h2>
    <p class="sub">Modèle conceptuel et ontologie appelés à remplacer la famille ISAD. Passage de l'arbre au graphe d'entités et de relations.</p>
    <table><tr><th>Entité RiC</th><th>Correspondance dans l'atelier</th><th>Occurrences</th></tr>

      <tr><td>Thing / Concept</td><td>Descripteurs du thésaurus</td><td class="num">${new Set(L.flatMap(n=>n.th)).size}</td></tr>
      <tr><td>Place</td><td>Descripteurs géographiques</td><td class="num">${new Set(L.flatMap(n=>n.geo)).size}</td></tr>
      <tr><td>Relations entre Records</td><td>Textes visés, modifiés, abrogés</td><td class="num">${L.filter(n=>n.abroge||n.modifies||n.vises).length}</td></tr></table>
    <p class="hint">L'export RiC-O en JSON-LD est disponible depuis l'onglet Commander. Il exprime ce que l'arborescence ne peut pas dire : un acte rattaché à plusieurs ensembles, et des relations typées entre actes.</p></div>

  <div class="card"><h2>OAIS — ISO 14721</h2>
    <p class="sub">Modèle de référence pour la préservation. L'atelier en réalise les trois paquets sans les nommer ; les voici nommés.</p>

      <tr><td>Ingest</td><td>Onglet Numériser, puis validation en Saisie</td><td>Appliqué</td></tr>

      <tr><td>PDI — Access Rights</td><td>Zone 4, conditions d'accès</td><td>Appliqué</td></tr>

  <div class="card"><h2>InterPARES — authenticité</h2>
    <p class="sub">L'authenticité se présume de l'identité et de l'intégrité réunies, documentées de façon continue.</p>
    <table><tr><th>Exigence</th><th>Réalisation</th></tr>
      <tr><td>Identité : auteur, date, action, lien archivistique</td><td>Bloc Authenticité de chaque fiche</td></tr>
      <tr><td>Intégrité : contrôle des altérations</td><td>Empreinte scellée, vérification par preuve de Merkle</td></tr>
      <tr><td>Chaîne de conservation documentée</td><td>Auteur de la description, mode, horodatage, champs corrigés</td></tr>
      <tr><td>Production de copies authentiques</td><td>Attestation de recherche certifiée, transcription avec empreinte</td></tr>
      <tr><td>Tiers de confiance</td><td>Les Archives Nationales, en qualité de dépositaire</td></tr></table>
    <p class="hint">L'exigence la plus exigeante d'InterPARES est la continuité : la chaîne ne doit pas comporter de rupture. L'atelier journalise chaque intervention, mais une migration de format ou un changement de système devrait être journalisé de la même manière.</p></div>

  <div class="card"><h2>ISO/TC 46 — information et documentation</h2>
    <p class="sub">Comité technique de l'ISO dont relèvent l'archivistique et la gestion des documents d'activité. Les normes ci-dessous sont celles qui concernent réellement ce chantier.</p>
    <table><tr><th>Norme</th><th>Objet</th><th>Incidence sur l'atelier</th></tr>
      <tr><td>ISO 15489-1</td><td>Gestion des documents d'activité — concepts et principes</td><td>Caractéristiques exigées : authenticité, fiabilité, intégrité, exploitabilité. Les quatre sont documentées par fiche</td></tr>
      <tr><td>ISO 23081-1 et -2</td><td>Métadonnées pour les documents d'activité</td><td>Métadonnées d'entité : document, agent, activité, règle. Recouvre le modèle RiC</td></tr>
      <tr><td>ISO 30300 / 30301 / 30302</td><td>Système de management des documents d'activité</td><td>Cadre de pilotage : politique écrite, objectifs, audit. À porter au niveau de l'institution, pas de l'outil</td></tr>
      <tr><td>ISO 16175-1 et -2</td><td>Exigences fonctionnelles des logiciels de gestion des archives</td><td>Grille d'évaluation à utiliser pour le cahier des charges de la phase 1</td></tr>
      <tr><td>ISO 20614</td><td>Protocole d'échange de données pour l'interopérabilité et la préservation</td><td>Format de versement des SIP entre producteur et service d'archives. À adopter avec SOPECAM et le SGPR</td></tr>
      <tr><td>ISO 13008</td><td>Conversion et migration des documents numériques</td><td>Toute migration de format devra être journalisée comme un événement de préservation</td></tr>
      <tr><td>ISO 15801</td><td>Valeur probante des informations conservées électroniquement</td><td>Fonde l'attestation certifiée et la copie conforme</td></tr>
      <tr><td>ISO 21946</td><td>Évaluation et sélection</td><td>Non applicable ici : le Journal officiel est conservé intégralement</td></tr>
      <tr><td>ISO 11799</td><td>Prescriptions pour le stockage des documents d'archives</td><td>Concerne les magasins de Yaoundé et de Buea, non le logiciel</td></tr>
      <tr><td>ISO 15511 (ISIL), ISO 27729 (ISNI)</td><td>Identifiants d'institutions et de personnes</td><td>À adopter pour identifier les Archives Nationales et les producteurs</td></tr>
      <tr><td>ISO 8601, ISO 639, ISO 3166</td><td>Dates, langues, pays</td><td>Déjà appliquées : dates AAAA-MM-JJ, codes fr/en/de, code cm</td></tr>
      <tr><td>ISO 14721 (OAIS), ISO 16363</td><td>Préservation et audit des dépôts de confiance</td><td>Voir le bloc OAIS. ISO 16363 est la grille de certification visée à terme</td></tr></table></div>

  <div class="card" style="border-left:3px solid var(--blue)"><h2>Loi n° 2024/001 du 24 juillet 2024 régissant les archives</h2>
    <p class="sub">Six chapitres, cinquante-huit articles. Elle abroge la loi n° 2000/010 et fonde juridiquement l'essentiel de ce que fait cet atelier.</p>
    <table><tr><th>Article</th><th>Disposition</th><th>Traduction dans l'outil</th></tr>
      <tr><td>Art. 2 § 35</td><td>Le traitement comprend le tri, le classement, la description, l'analyse, l'indexation et la rédaction des instruments de recherche</td><td>Définition légale exacte de ce que produit l'atelier</td></tr>
      <tr><td>Art. 4</td><td>Les archives publiques sont insaisissables, inaliénables, intangibles et imprescriptibles</td><td>Interdit toute cession du fonds ; seule la prestation de service est facturable</td></tr>

      <tr><td>Art. 29</td><td>La copie certifiée conforme produite par l'organisme vaut preuve au même titre que l'original</td><td>Ce qui donne sa valeur à l'attestation scellée</td></tr>
      <tr><td>Art. 30 al. 2</td><td>La communication exclut toute reproduction, diffusion ou utilisation à des fins commerciales des documents communiqués</td><td>Contrainte forte sur le module de commande — voir ci-dessous</td></tr>

    <p class="hint">Point à trancher avant toute mise en service payante : l'article 30 alinéa 2 interdit l'usage commercial des documents communiqués, tandis que l'article 28 prévoit la délivrance d'expéditions authentiques dont les modalités sont fixées par voie réglementaire. Le module de commande repose donc sur l'article 28, et son tarif suppose le décret d'application. À faire confirmer par un juriste.</p></div>

// ══════════════════════════════════════════════════ 6. CHRONOLOGIE
function renderChrono(){
  const L=OPAC().filter(n=>/^\d{4}-\d{2}-\d{2}$/.test(n.ds)&&/^\d{4}-\d{2}-\d{2}$/.test(n.dp));
  if(!L.length) return vide("Aucune notice ne porte à la fois une date de signature et une date de publication exploitables.");
  const ds=L.map(n=>+new Date(n.ds)).concat(L.map(n=>+new Date(n.dp)));
  const T0=Math.min(...ds), T1=Math.max(...ds), SP=Math.max(T1-T0,864e5*365);
  const pc=d=>((+new Date(d)-T0)/SP*100);
  const A0=new Date(T0).getFullYear(), A1=new Date(T1).getFullYear();
  const ans=[]; for(let a=A0;a<=A1;a++) ans.push(a);
  app.innerHTML=`<div class="card"><h2>Signature et publication</h2>
    <p class="sub">Chaque trait relie la date de signature d'un acte à sa parution au Journal officiel.</p>
    ${[...L].sort((a,b)=>a.ds.localeCompare(b.ds)).map(n=>{const a=pc(n.ds),b=pc(n.dp);
      return `<div class="track"><div class="lbl" data-id="${n.id}">${esc(n.intitule.slice(0,62))}${n.intitule.length>62?'…':''}
        <span>${esc(tType(n.type))}${n.numero?' n° '+esc(n.numero):''} · décalage de ${ecart(n.ds,n.dp)} mois</span></div>
        <div class="line"><div class="rail" style="left:${a}%;width:${Math.max(b-a,0)}%"></div>
        <div class="pt sig" style="left:${a}%"></div><div class="pt pub" style="left:${b}%"></div></div></div>`}).join('')}
    <div class="axis"><div></div><div class="ax">${ans.map(y=>`<i style="left:${Math.max(0,Math.min(100,pc(y+'-01-01')))}%">${y}</i>`).join('')}</div></div>
    <div class="legend"><span><i style="background:var(--blue)"></i>date de signature</span><span><i style="background:var(--ochre)"></i>date de publication</span></div></div>
  <div class="card"><h2>Ce que cela impose</h2>
    <p class="sub" style="margin-bottom:0">Un index construit sur la date du numéro rassemblerait des actes signés à des années d'écart. La date de signature est la seule clé de classement chronologique utilisable, et le calcul de l'entrée en vigueur doit distinguer les deux dates.</p></div>`;
  document.querySelectorAll('.lbl').forEach(l=>l.onclick=()=>{VUE='rech';ouvert=l.dataset.id;sync();scrollTo(0,0)});
}

function renderThes(){
  const L=OPAC();

  app.innerHTML=`<div class="card"><h2>Vocabulaire relevé</h2>
    <p class="sub">Termes employés lors du dépouillement, en langage libre. Leur regroupement en concepts pérennes et termes d'époque constituera le thésaurus proprement dit.</p>
    ${B.map(([k,lb])=>{ const m={}; L.forEach(n=>n[k].forEach(v=>m[v]=(m[v]||0)+1));
      const e=Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
      return `<h3 style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:20px 0 10px">${lb} — ${e.length} terme(s)</h3>
      <div class="thlist">${e.length?e.map(([v,c])=>`<span class="thitem" ${k==='th'?`data-t="${esc(v)}"`:''}>${esc(v)}<b>${c}</b></span>`).join(''):'<span style="color:var(--ink3);font-size:13.5px">—</span>'}</div>`;}).join('')}</div>`;

}

// ══════════════════════════════════════════════════ 8. ASSISTANT
let CHAT=[],occupe=false;
const STOP=new Set(['les','des','une','aux','pour','par','sur','dans','quel','quels','quelle','quelles','est','ce','que','qui','quoi','combien','sont','avec','entre','plus','tout','tous','cette','ces','quand','comment','etait','était','avez','avoir','faut','peut','existe','trouve','donne','parle','dire','sujet','propos','information','informations','acte','actes','texte','textes','portent','porte','portant','concernent','concerne','contient','contiennent','cameroun','camerounais','camerounaise','journal','officiel','republique','république','notice','notices','catalogue','fonds','archives','nationales','svp','merci']);
const contenu=q=>norm(q).replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(t=>t.length>3&&!STOP.has(t));
function jetons(n){
  const base=norm([n.intitule,n.resume,n.numero,n.type,n.autorite,n.th.join(' '),n.geo.join(' '),n.pers.join(' '),n.org.join(' '),n.abroge,n.notes].join(' '))
    .replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const S=new Set(base);
  if(n.abroge){ ['abroge','abrogation','abroger','abrogeant','abrogees'].forEach(t=>S.add(t)); }
  if(n.modifies){ ['modifie','modification','modifier'].forEach(t=>S.add(t)); }
  if(n.vises){ ['vise','visa','visant'].forEach(t=>S.add(t)); }
  if(n.texte){ ['transcription','integral','integrale'].forEach(t=>S.add(t)); }
  if(ecart(n.ds,n.dp)>=6){ ['decalage','delai','retard','tardive'].forEach(t=>S.add(t)); }
  if(n.pers.length){ ['personne','personnes','nom','noms','patronyme'].forEach(t=>S.add(t)); }
  if(!n.complet){ ['tronque','incomplet','lacune','manquant'].forEach(t=>S.add(t)); }
  return S;
}
function apparie(t,S){ if(S.has(t)) return true;
  for(const d of S){ if(d.length>=4&&t.length>=4&&(d.startsWith(t)||t.startsWith(d))) return true; } return false; }

function trouver(query){
  const L=OPAC(); if(!L.length) return {hits:[],termes:[],raison:'vide'};
  const T=[...new Set(contenu(query))];
  if(!T.length) return {hits:[],termes:[],raison:'vague'};
  const docs=L.map(n=>({n,S:jetons(n)})), Nd=docs.length, df={};
  T.forEach(t=> df[t]=docs.filter(d=>apparie(t,d.S)).length);
  const presents=T.filter(t=>df[t]>0);
  const utiles=T.filter(t=>df[t]>0&&df[t]<Nd);
  if(!utiles.length || presents.length/T.length<0.5) return {hits:[],termes:T,raison:'hors'};
  const idf=t=>Math.log(Nd/df[t]);
  const S=docs.map(d=>({n:d.n,s:utiles.reduce((a,t)=>a+(apparie(t,d.S)?idf(t):0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!S.length) return {hits:[],termes:T,raison:'hors'};
  return {hits:S.filter(x=>x.s>=S[0].s*0.45).slice(0,3),termes:utiles,raison:''};
}

// ---- moteur de réponse local : reconnaît l'intention et compose depuis les champs ----
const cite=n=>`${n.type}${n.numero?` n° ${n.numero}`:' (numéro non relevé)'}${n.ds?` du ${dfr(n.ds)}`:''}`;
const enum2=a=>a.length===1?a[0]:a.slice(0,-1).join(', ')+' et '+a[a.length-1];

function repondre(question,hits){
  const nq=norm(question), H=hits.map(h=>h.n), L=OPAC();

  if(/abrog/.test(nq)){
    const A=L.filter(n=>n.abroge);
    if(!A.length) return "Aucune notice du catalogue ne relève d'abrogation.";
    return (A.length===1?"Une seule abrogation est relevée dans le catalogue. ":`${A.length} abrogations sont relevées. `)
      + A.map(n=>`Le ${cite(n)} abroge ${n.abroge}.`).join(' ')
      + " Le texte abrogé n'étant pas lui-même décrit dans le fonds, la relation est signalée mais non résolue.";
  }
  if(/modifi/.test(nq)){
    const A=L.filter(n=>n.modifies);
    return A.length? A.map(n=>`Le ${cite(n)} modifie ${n.modifies}.`).join(' ')
      : "Aucune notice du catalogue ne relève de modification d'un texte antérieur.";
  }
  if(/(decalage|delai|retard|combien de temps|entre la signature|avant.*publi|tardiv)/.test(nq)){
    const A=L.filter(n=>ecart(n.ds,n.dp)>=1).sort((a,b)=>ecart(b.ds,b.dp)-ecart(a.ds,a.dp));
    if(!A.length) return "Les notices du catalogue ne permettent pas de calculer d'écart entre signature et publication.";
    const m=A[0];
    return `L'écart entre la signature et la publication va de ${ecart(A[A.length-1].ds,A[A.length-1].dp)} à ${ecart(m.ds,m.dp)} mois. Le plus important concerne le ${cite(m)}, publié le ${dfr(m.dp)}, soit ${ecart(m.ds,m.dp)} mois après sa signature. C'est pourquoi le classement se fait sur la date de signature et non sur celle du numéro.`;
  }
  if(/^\s*combien|nombre d/.test(nq)){
    if(!H.length) return "Aucune notice ne correspond.";
    return `${H.length} notice${H.length>1?'s':''} du catalogue correspond${H.length>1?'ent':''} : ${enum2(H.map(n=>`le ${cite(n)}`))}.`;
  }
  if(/(qui a signe|qui signe|signataire|quelle autorite|par qui)/.test(nq)){
    const A=[...new Set(H.map(n=>n.autorite).filter(Boolean))];
    if(!A.length) return "L'autorité signataire n'est pas renseignée dans les notices trouvées.";
    return `Autorité signataire : ${enum2(A)}. ` + H.map(n=>`Le ${cite(n)} est signé par ${n.autorite||'—'}.`).join(' ');
  }
  if(/(^quand|quelle date|en quelle annee|date de)/.test(nq)){
    return H.map(n=>`Le ${cite(n)} a été signé le ${dfr(n.ds)} et publié le ${dfr(n.dp)}.`).join(' ');
  }
  if(/(^ou |quel lieu|quelle ville|quelle region|localis)/.test(nq)){
    const G=[...new Set(H.flatMap(n=>n.geo))];
    return G.length? `Lieux mentionnés : ${enum2(G)}. `+H.filter(n=>n.geo.length).map(n=>`Le ${cite(n)} concerne ${enum2(n.geo)}.`).join(' ')
      : "Aucun lieu n'est indexé dans les notices trouvées.";
  }
  if(/(texte integral|transcription|texte complet)/.test(nq)){
    const A=L.filter(n=>n.texte);
    return A.length? `${A.length} notice${A.length>1?'s disposent':' dispose'} d'une transcription : ${enum2(A.map(n=>`le ${cite(n)}`))}. Le texte intégral est consultable depuis la fiche de chaque acte.`
      : "Aucune notice du catalogue ne porte de transcription pour l'instant.";
  }
  if(/(tronque|incomplet|lacune|manquant|reserve)/.test(nq)){
    const A=L.filter(n=>!n.complet||n.notes||n.notec);
    return A.length? `${A.length} notice${A.length>1?'s comportent':' comporte'} des réserves de description. `
      + A.slice(0,3).map(n=>`Pour le ${cite(n)} : ${n.notec||n.notes||'description incomplète'}`).join(' ')
      : "Aucune réserve de description n'est signalée.";
  }
  if(/(personne|nom|patronyme|qui est|nomme)/.test(nq)){
    const P=[...new Set(H.flatMap(n=>n.pers))].filter(p=>p!=='Paul Biya');
    if(P.length) return `Personnes citées dans les notices trouvées : ${enum2(P.slice(0,12))}${P.length>12?', et d\'autres':''}. Ces noms proviennent de la description et doivent être contrôlés sur l'image avant tout usage.`;
  }

  // par défaut : énumération raisonnée
  if(H.length===1){ const n=H[0];
    return `Une notice correspond : le ${cite(n)}, « ${n.intitule} ». ${n.resume||'Aucun résumé analytique n\'est établi.'}`
      + (n.notes?` Réserve de description : ${n.notes}`:'');
  }
  return `${H.length} notices correspondent. `
    + H.map(n=>`Le ${cite(n)} — ${n.intitule}.${n.resume?' '+n.resume:''}`).join(' ')
    + " Ouvrez une notice pour le détail et la provenance.";
}
const EX=[["Quel texte a été abrogé, et par quel acte ?",0],["Quels actes portent des nominations ?",0],
["Quel est le décalage entre signature et publication ?",0],["Quels actes concernent des associations ?",0],
["Quelles notices comportent des réserves ?",0],["Quel était le régime de l'indigénat au Cameroun ?",1]];

let MONTRER_CLE=false;
function panneauCle(){
  const masquee=CLE_GEMINI?CLE_GEMINI.slice(0,4)+'…'+CLE_GEMINI.slice(-4):'';
  return `<div class="card" style="border-left:3px solid var(--blue)"><h2>Clé API Gemini</h2>
    ${CLE_GEMINI&&!MONTRER_CLE?`<p class="sub" style="margin-bottom:10px">Clé enregistrée : <span class="mono">${esc(masquee)}</span>. Les réponses passent par le modèle de langue Gemini (Google AI Studio).</p>
      <div class="actions"><button class="b" id="cle-chg">Changer</button><button class="b" id="cle-rz" style="color:var(--red)">Retirer</button></div>`
    :`<p class="sub">Sans clé, l'assistant se limite à retrouver des notices par mots-clés — il ne peut pas tenir une vraie conversation. Une clé gratuite (débit limité, sans carte bancaire) s'obtient en quelques minutes sur <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>
      <div class="row"><label class="lb">Clé API</label><div><input id="cle-in" type="password" placeholder="AIza…" value="${esc(CLE_GEMINI)}"></div></div>
      <div class="actions"><button class="b pri" id="cle-ok">Enregistrer</button>${CLE_GEMINI?`<button class="b" id="cle-no">Annuler</button>`:''}</div>
      <p class="hint" style="margin-top:10px">La clé reste uniquement dans ce navigateur (comme les mots de passe du prototype) — elle n'est jamais écrite dans ce fichier ni envoyée ailleurs qu'à Google. Quiconque a accès à ce poste ou à ses outils de développement peut néanmoins la lire : n'utilisez pas ici une clé à fort plafond de dépense.</p>`}
    </div>`;
}
function attacherPanneauCle(){
  const chg=document.getElementById('cle-chg'); if(chg) chg.onclick=()=>{MONTRER_CLE=true;renderAssistant()};
  const rz=document.getElementById('cle-rz'); if(rz) rz.onclick=async()=>{ if(confirm('Retirer la clé API enregistrée ?')){ await saveGemini(''); MONTRER_CLE=false; renderAssistant(); } };
  const ok=document.getElementById('cle-ok'); if(ok) ok.onclick=async()=>{ await saveGemini(document.getElementById('cle-in').value.trim()); MONTRER_CLE=false; renderAssistant(); };
  const no=document.getElementById('cle-no'); if(no) no.onclick=()=>{MONTRER_CLE=false;renderAssistant()};
}
function renderAssistant(){
  if(!DB.notices.length) return vide("L'assistant ne peut répondre que sur des notices validées. Le catalogue est vide.");
  app.innerHTML=panneauCle()+`<div class="card"><h2>Recherche conversationnelle</h2>
    <p class="sub">Une vraie conversation : l'assistant se souvient des échanges précédents et peut répondre à une salutation ou à une question de suivi. Pour toute affirmation sur un acte, il s'appuie uniquement sur les notices du fonds, retrouvées automatiquement à chaque tour. Si le service de rédaction n'est pas joignable, il retombe sur un simple filtrage par mots-clés, sans mémoire de conversation.</p>
    <div style="min-height:150px;margin-bottom:14px">${CHAT.length?CHAT.map(m=>{
      if(m.role==='user') return `<div class="msg u"><span>${esc(m.text)}</span></div>`;
      const montrerRetr = m.state==='refus' || (m.hits&&m.hits.length);
      return `<div class="msg a ${m.state==='refus'?'refus':''}">
        ${montrerRetr?(m.hits&&m.hits.length?`<div class="retr">${m.hits.length} notice(s) retrouvée(s)${m.termes&&m.termes.length?` — termes retenus : ${esc(m.termes.join(', '))}`:''}</div>
        ${m.hits.map(h=>`<div class="src" data-go="${h.n.id}"><b>${esc(tType(h.n.type))}${h.n.numero?' n° '+esc(h.n.numero):''}</b>${esc(h.n.intitule.slice(0,72))}</div>`).join('')}`
        :`<div class="retr">aucune notice retrouvée</div>`):''}
        <div class="body">${m.state==='loading'?'<span style="color:var(--ink3)">Réflexion…</span>':esc(m.text)}</div>
        ${m.state==='local'?`<div style="font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:6px">réponse composée localement depuis les champs des notices, sans modèle de langue</div>`:''}
      </div>`;
    }).join(''):'<p style="color:var(--ink3);font-size:14px;margin:0">Posez une question sur les notices du catalogue.</p>'}</div>
    <div class="askrow"><input id="qq" placeholder="Votre question…" ${occupe?'disabled':''}><button id="go" ${occupe?'disabled':''}>Demander</button></div>
    <div class="exs">${EX.map(([t,n])=>`<span class="ex ${n?'neg':''}" data-ex="${esc(t)}">${esc(t)}</span>`).join('')}</div>
    <p class="hint">La question en pointillés porte volontairement sur un sujet absent du catalogue : elle vérifie que l'assistant refuse plutôt que d'inventer.</p></div>`;
  const qi=document.getElementById('qq');
  const envoi=()=>{const v=qi.value.trim(); if(v&&!occupe) demander(v)};
  document.getElementById('go').onclick=envoi; qi.onkeydown=e=>{if(e.key==='Enter')envoi()};
  document.querySelectorAll('.ex').forEach(x=>x.onclick=()=>{if(!occupe)demander(x.dataset.ex)});
  document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{VUE='rech';ouvert=x.dataset.go;sync();scrollTo(0,0)});
  attacherPanneauCle();
  if(!occupe&&qi) qi.focus();
}
const REGLES_ASSISTANT=`Tu es l'assistant de consultation du fonds du Journal officiel décrit par les Archives Nationales du Cameroun. Tu tiens une vraie conversation : tu te souviens des échanges précédents, tu peux répondre à une salutation, à une question de suivi elliptique (« et son numéro ? », « pourquoi ? ») en t'appuyant sur ce qui a déjà été dit, et tu peux demander une précision si la question est trop vague plutôt que de refuser sèchement.

RÈGLES ABSOLUES sur le fond :
- Toute affirmation factuelle sur un acte doit provenir UNIQUEMENT des notices fournies dans ce tour ou dans un tour précédent de cette même conversation. N'ajoute aucune connaissance extérieure, même si le sujet t'est familier par ailleurs.
- Si les notices disponibles ne suffisent pas à répondre, dis-le simplement et n'extrapole pas.
- Cite chaque affirmation par le type d'acte et son numéro.
- Ce sont des notices de description, non le texte intégral. Ne prétends pas citer le texte lui-même.
- Signale les réserves de description quand c'est pertinent.
- Ne dis jamais si un texte est en vigueur : ce fonds est documentaire, pas juridique.
- Pour une salutation, une question sur toi-même ou sur ce que tu sais faire, réponds naturellement et brièvement, sans notice à citer.
- Reste concis (quelques phrases), en français, sans titre ni liste à puces — un ton de conversation, pas de rapport.`;

async function demander(question){
  CHAT.push({role:'user',text:question});
  const R=trouver(question);
  const hits=R.hits;
  const m={role:'assistant',hits,termes:R.termes,state:'loading',text:''}; CHAT.push(m); occupe=true; renderAssistant();

  const ctx=hits.map(h=>({type:h.n.type,numero:h.n.numero||null,intitule:h.n.intitule,date_signature:h.n.ds,
    date_publication:h.n.dp,autorite:h.n.autorite,pages:h.n.pages,resume:h.n.resume||null,themes:h.n.th,
    personnes:h.n.pers,organismes:h.n.org,texte_abroge:h.n.abroge||null,reserves:h.n.notes||null}));
  // L'historique complet est envoyé à chaque tour : c'est ce qui permet une vraie question de suivi
  // (« et son numéro ? ») sans que l'utilisateur ait à tout répéter. Les notices retrouvées pour CE
  // tour sont jointes à la question ; celles des tours précédents restent disponibles dans l'historique.
  const historique=CHAT.slice(0,-1).filter(x=>x.text).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}));
  const p=hits.length
    ? `NOTICES RETROUVÉES POUR CETTE QUESTION : ${JSON.stringify(ctx,null,1)}\n\nQUESTION : ${question}`
    : `Aucune notice n'a été retrouvée automatiquement pour cette question (elle est peut-être une salutation, une question de suivi, ou hors du sujet du fonds).\n\nQUESTION : ${question}`;

  if(CLE_GEMINI){
    try{ m.text=await appelGemini(REGLES_ASSISTANT,historique,p); m.state='ok'; }
    catch(e){ replique_locale(m,question,hits,R); }
  } else if(RESEAU!==false){
    try{
      const t=await appel({model:"claude-sonnet-4-6",max_tokens:1000,system:REGLES_ASSISTANT,
        messages:[...historique,{role:'user',content:p}]});
      m.text=t; m.state='ok';
    }catch(e){ replique_locale(m,question,hits,R); }
  } else { replique_locale(m,question,hits,R); }
  occupe=false; renderAssistant();
}
// Repli sans réseau : un simple filtrage par mots-clés ne sait ni saluer ni tenir le fil d'une
// conversation, donc il doit rester honnête sur ses limites plutôt que de deviner.
function replique_locale(m,question,hits,R){
  if(hits.length){ m.state='local'; m.text=repondre(question,hits); return; }
  m.state='refus';
  m.text = R.raison==='vague'
    ? "Sans connexion au modèle, je ne peux pas tenir une vraie conversation : je ne fais que retrouver des notices par mots-clés, et votre question n'en contient aucun. Précisez un type d'acte, un nom, une date ou un thème."
    : "Sans connexion au modèle, je ne peux que retrouver des notices par mots-clés, et aucune ne correspond à cette question."
      + (R.termes.length?`\n\nTermes cherchés : ${R.termes.join(', ')}.`:'');
}
