<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier du Journal officiel — administration et catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>

<style>
:root{--paper:#F3F4F0;--card:#FFF;--ink:#1B2025;--ink2:#525C66;--ink3:#8A939C;
--rule:#DEE2DA;--ruleS:#C4CBBF;--blue:#2B4C7E;--blueBg:#E9EFF7;--ochre:#8A6D1F;--ochreBg:#F8F2DF;
--red:#8C3A3A;--redBg:#F8EAEA;--sans:"IBM Plex Sans",system-ui,sans-serif;
--serif:"IBM Plex Serif",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}

header{background:var(--card);border-bottom:1px solid var(--ruleS);position:sticky;top:0;z-index:30}
.r1{max-width:1080px;margin:0 auto;padding:13px 22px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:18px}
.brand em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:11px;display:block;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.seg{margin-left:auto;display:flex;border:1px solid var(--ruleS);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;border:0;background:#fff;color:var(--ink2);padding:7px 15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.menuPro{position:relative;margin-left:auto}
.menuPro>button{font:inherit;font-size:13.5px;border:1px solid var(--ruleS);background:#fff;color:var(--ink2);padding:7px 15px;border-radius:6px;cursor:pointer}
.menuPro>button[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.menuList{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--ruleS);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:200px;z-index:20;overflow:hidden}
.menuList button{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;border:0;background:none;color:var(--ink2);padding:9px 14px;cursor:pointer}
.menuList button:hover{background:var(--paper);color:var(--ink)}
.menuList button+button{border-top:1px solid var(--rule)}
.who{font-family:var(--mono);font-size:11.5px;color:var(--ink2);border:1px solid var(--rule);border-radius:5px;padding:3px 9px}
.r2{max-width:1080px;margin:0 auto;padding:8px 22px 10px;display:flex;gap:2px;flex-wrap:wrap}
.r2 button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink2);padding:6px 12px;border-radius:5px;cursor:pointer}
.r2 button:hover{background:var(--paper)}
.r2 button[aria-current="true"]{background:var(--blueBg);color:var(--blue);font-weight:500}

main{max-width:1080px;margin:0 auto;padding:24px 22px 90px}
.card{background:var(--card);border:1px solid var(--ruleS);border-radius:2px;padding:20px 24px;margin-bottom:18px}
.card h2{font-size:17px}
.card p.sub{color:var(--ink2);font-size:13.5px;margin:5px 0 16px}
.warn{background:var(--ochreBg);border:1px solid #E3D6AB;color:#5A4914;padding:10px 14px;border-radius:5px;font-size:13px;margin-bottom:18px}
.empty{color:var(--ink3);font-size:14px;padding:26px 0;text-align:center}
.hint{font-size:12.5px;color:var(--ink3);margin-top:6px}
input,select,textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:4px;padding:7px 9px}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
button.b{font:inherit;font-size:14px;border-radius:5px;padding:9px 18px;cursor:pointer;border:1px solid var(--ruleS);background:#fff;color:var(--ink)}
button.b:hover{border-color:var(--ink3)}
button.b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
button.b:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:400}
td.num{font-family:var(--mono);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mono{font-family:var(--mono)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.stat{background:#fff;padding:14px 16px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-family:var(--serif);font-size:26px;line-height:1.2;margin-top:3px}
.stat .v small{font-size:13px;color:var(--ink2);font-family:var(--sans)}
.bar-mini{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;min-width:70px}
.bar-mini i{display:block;height:100%;background:var(--blue)}

/* fiche de saisie */
.fiche{background:var(--card);border:1px solid var(--ruleS);border-left:3px solid var(--ochre);border-radius:2px}
.fh2{display:flex;justify-content:space-between;gap:16px;padding:15px 20px;border-bottom:1px solid var(--ruleS);flex-wrap:wrap}
.cote{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.7}
.cote b{color:var(--ink);font-weight:500}
.chipm{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:3px;white-space:nowrap;height:fit-content}
.m-manuel{background:var(--blueBg);color:var(--blue)}.m-assiste{background:var(--ochreBg);color:var(--ochre)}
.grp{padding:2px 20px 12px}
.grp-t{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:15px 0 7px;border-bottom:1px solid var(--rule);margin-bottom:10px}
.row{display:grid;grid-template-columns:196px 1fr;gap:14px;align-items:start;padding:6px 0;border-bottom:1px solid #F1F2EF}
.row:last-child{border-bottom:0}
label.lb{font-size:13.5px;color:var(--ink2);padding-top:7px}
label.lb i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);line-height:1.4}
.fld.prop input,.fld.prop select,.fld.prop textarea{background:var(--ochreBg);border-color:#E0D2A4}
.fld.corr input,.fld.corr select,.fld.corr textarea{background:var(--redBg);border-color:#E3BEBE}
.tagmark{font-family:var(--mono);font-size:10.5px;margin-top:3px;display:none}
.fld.prop .tagmark{display:block;color:var(--ochre)}.fld.corr .tagmark{display:block;color:var(--red)}

/* opac */
.layout{display:grid;grid-template-columns:225px 1fr;gap:26px;align-items:start}
.fgrp{margin-bottom:18px}
.fgrp h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:400;padding-bottom:6px;border-bottom:1px solid var(--rule);margin-bottom:7px}
.fitem{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);padding:2px 0;cursor:pointer}
.fitem input{margin:0;accent-color:var(--blue);width:auto}
.fitem .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.clear{font:inherit;font-size:12.5px;background:none;border:0;color:var(--blue);cursor:pointer;padding:0 0 10px;text-decoration:underline}
.rescount{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.hit{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ruleS);border-radius:2px;padding:14px 17px;margin-bottom:10px;cursor:pointer}
.hit:hover{border-left-color:var(--blue)}
.hit .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.hit .meta b{color:var(--ochre);font-weight:500}
.hit h3{font-family:var(--serif);font-size:16px;line-height:1.4}
.hit p{margin:5px 0 0;font-size:14px;color:var(--ink2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;background:var(--paper);border:1px solid var(--rule);color:var(--ink2);padding:2px 8px;border-radius:11px}
.chip.b{background:var(--blueBg);border-color:#CBD9EC;color:var(--blue);cursor:pointer}
.back{font:inherit;font-size:13.5px;background:none;border:0;color:var(--blue);cursor:pointer;padding:0 0 13px}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px}
.fsec{padding:18px 26px;border-bottom:1px solid var(--rule)}.fsec:last-child{border-bottom:0}
.fsec h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:400;margin-bottom:11px}
.dl{display:grid;grid-template-columns:190px 1fr;gap:5px 18px;font-size:14.5px}
.dl dt{color:var(--ink3);font-size:13.5px}.dl dd{margin:0}
.gap{background:var(--ochreBg);border:1px solid #E3D6AB;border-radius:5px;padding:11px 14px;font-size:13.5px;color:#5A4914}
.caveat{border-left:2px solid var(--ochre);padding-left:13px;font-size:14px;color:var(--ink2)}
.track{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.track .lbl{font-size:13px;color:var(--ink2);line-height:1.35;cursor:pointer}
.track .lbl span{font-family:var(--mono);font-size:11px;color:var(--ink3);display:block}
.line{position:relative;height:22px}
.line .rail{position:absolute;top:10px;height:2px;background:var(--ochre);opacity:.5}
.line .pt{position:absolute;top:5.5px;width:11px;height:11px;border-radius:50%;margin-left:-5.5px}
.pt.sig{background:var(--blue)}.pt.pub{background:var(--ochre)}
.axis{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:6px}
.ax{position:relative;height:20px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.ax i{position:absolute;transform:translateX(-50%);font-style:normal}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink2);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.thlist{display:flex;flex-wrap:wrap;gap:8px}
.thitem{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:5px 13px;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.thitem:hover{border-color:var(--blue);color:var(--blue)}
.thitem b{font-family:var(--mono);font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:6px}
.msg{margin-bottom:15px}.msg.u{text-align:right}
.msg.u span{display:inline-block;background:var(--blue);color:#fff;padding:9px 15px;border-radius:14px 14px 3px 14px;font-size:14.5px;max-width:78%;text-align:left}
.msg.a .body{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--blue);padding:14px 17px;font-size:14.5px;white-space:pre-wrap}
.msg.a.refus .body{border-left-color:var(--ochre);background:var(--ochreBg);color:#5A4914}
.retr{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.src{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 11px;font-size:12.5px;color:var(--ink2);cursor:pointer;margin-bottom:4px}
.src:hover{border-color:var(--blue);color:var(--blue)}
.src b{font-family:var(--mono);font-weight:500;font-size:11.5px;color:var(--ochre);margin-right:7px}
.askrow{display:flex;gap:9px}.askrow input{flex:1;font-size:15px;padding:10px 13px}
.askrow button{font:inherit;font-size:14px;padding:0 20px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;width:auto}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.ex{font-size:12.5px;background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:4px 12px;cursor:pointer;color:var(--ink2)}
.ex:hover{border-color:var(--blue);color:var(--blue)}
.ex.neg{border-style:dashed;color:var(--ochre);border-color:#E3D6AB}
.hash{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--ink2)}
.rootbox{background:var(--ink);color:#fff;border-radius:5px;padding:14px 17px}
.rootbox .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.rootbox .h{font-family:var(--mono);font-size:12.5px;word-break:break-all;margin-top:4px}
.leaf{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.leaf .h{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px}
.step .i{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.verdict{border-radius:5px;padding:13px 16px;font-size:14.5px;margin-top:13px}
.verdict.ok{background:#EAF2EC;border:1px solid #BCD6C3;color:#255536}
.verdict.ko{background:var(--redBg);border:1px solid #E3BEBE;color:var(--red)}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.offer,.pay{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:14px 16px;cursor:pointer}
.offer:hover,.pay:hover{border-color:var(--ink3)}
.offer[data-on="1"],.pay[data-on="1"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blueBg)}
.offer .t,.pay .n{font-size:14.5px;font-weight:500}
.offer .p{font-family:var(--serif);font-size:22px;margin-top:4px}
.offer .d,.pay .f{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.pays{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sel{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2);padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.sel input{accent-color:var(--blue);margin:0;width:auto}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0 4px;font-size:14px;color:var(--ink2)}
.tot b{font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:500}
.prog{font-size:13.5px;color:var(--ink);padding:4px 0}
.recu{background:var(--card);border:1px solid var(--ruleS);border-top:3px solid var(--blue);padding:20px 24px}
mark{background:#FBEFC4;color:inherit;padding:0 1px;border-radius:2px}
.fil{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-bottom:10px;line-height:1.9}
.fil a{color:var(--blue);cursor:pointer;text-decoration:none}
.fil a:hover{text-decoration:underline}
.fil span{color:var(--ink3);margin:0 5px}
.pan{display:flex;align-items:center;gap:10px;background:var(--blueBg);border:1px solid #CBD9EC;border-radius:5px;padding:8px 13px;margin-bottom:14px;font-size:13.5px;color:var(--blue)}
.pan button{font:inherit;font-size:13px;border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.addp{font:inherit;font-size:12px;border:1px solid var(--rule);background:#fff;color:var(--ink2);border-radius:12px;padding:2px 10px;cursor:pointer;margin-left:auto}
.addp[data-in="1"]{background:var(--blue);border-color:var(--blue);color:#fff}
.perma{font-family:var(--mono);font-size:11.5px;color:var(--ink3);word-break:break-all}
@media(max-width:860px){.layout,.two,.dl,.track,.axis,.row{grid-template-columns:1fr}.dl dd{margin-bottom:8px}label.lb{padding-top:0}}
</style>

<header>
  <div class="r1">
    <div class="brand">Atelier du Journal officiel<em>Archives Nationales du Cameroun</em></div>
    <div class="who" id="who">—</div>
    <div class="who" id="compte" style="margin-left:8px"></div>
    <div id="navAuth"></div>
    <div class="seg" style="margin-left:8px">
      <button data-l="fr" aria-pressed="true">FR</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="r2" id="tabs"></div>
</header>

<main>
  <div class="warn" id="warn" hidden></div>
  <div id="app"></div>
</main>

<script>
// ══════════════════════════════════════════════════ REPLI DE STOCKAGE
// Sur un poste ouvert dans un navigateur ordinaire (double-clic, ou via demarrer-atelier.bat), window.storage
// n'existe pas nativement : sans ce repli, rien ne survivrait à la fermeture de l'onglet (catalogue, comptes, session).
if(!window.storage){
  window.storage={
    async get(cle){ try{ const v=localStorage.getItem(cle); return v==null?null:{value:v}; }catch(e){ return null; } },
    async set(cle,valeur){ localStorage.setItem(cle,valeur); }
  };
}

// ══════════════════════════════════════════════════ ÉTAT
const KEY='atelier-jo-complet';
let DB={config:null,notices:[],queue:[]}, memoryOnly=false;
let ESPACE='opac', VUE='accueil';

// ══════════════════════════════════════════════════ COMPTES ET RÔLES
// Comptes et session gardés hors de DB : ils ne doivent jamais voyager dans un export/import/fusion du catalogue.
const KEY_AUTH='atelier-jo-comptes', KEY_SESSION='atelier-jo-session', KEY_GEMINI='atelier-jo-cle-gemini';
let COMPTES=[], UTILISATEUR=null, authMemoire=false;
let PUBLIC_AUTH=null; // 'login' | 'inscription' | null — écran de connexion publique affiché par-dessus le catalogue
let LOGIN_CONTEXTE=null; // 'stagiaire' quand la connexion est atteinte par le raccourci dédié, pour adapter le message
const PERMISSIONS={
  admin:      ['versement','tele','saisie','mesures','donnees','comptes','commandes','controle'],
  operateur:  ['versement','tele','saisie','mesures','donnees'],
  controleur: ['versement','tele','saisie','mesures','donnees','controle'],
  stagiaire:  ['versement','tele','saisie'],
  chercheur:  []
};
const ROLES=[['admin','Administrateur'],['operateur','Opérateur'],['controleur','Opérateur — contrôleur qualité'],['stagiaire','Stagiaire'],['chercheur','Chercheur (public)']];
// Rôle du catalogue public, normalement obtenu par inscription libre plutôt que créé depuis l'onglet Comptes.
// N'accède jamais à l'espace Administration, quels que soient les droits qu'on lui donnerait par erreur.
const ROLE_PUBLIC='chercheur';

const TABS={
  admin:[['versement','Versement'],['tele','Numériser et traiter'],['saisie','Saisie'],['controle','Contrôle qualité'],['mesures','Mesures'],['donnees','Données'],['comptes','Comptes'],['commandes','Commandes']],
  opac:[['accueil','Accueil'],['rech','Rechercher'],['classement','Plan de classement'],['instr','Instruments de recherche'],['chrono','Chronologie'],['thes','Thésaurus'],['assist','Assistant'],['integ','Intégrité'],['normes','Normes'],['cmd','Commander'],['mescommandes','Mes commandes']]
};
const SERIES=['Amtsblatt für das Schutzgebiet Kamerun (1908-1914)','JO du Cameroun — mandat/tutelle française (1920-1959)',
'Nigeria Gazette / Southern Cameroons (1922-1960)','JO de la République du Cameroun (1960-1961)',
'JO de la République Fédérale (1961-1972)','JO de la République Unie (1972-1984)','JO de la République du Cameroun (1984-)'];
const TYPES=['décret','arrêté','loi','ordonnance','décision','nomination','avis','adjudication','circulaire','autre'];
const TYPES_EN={"décret":"Decree","arrêté":"Order","loi":"Law","ordonnance":"Ordinance","décision":"Decision",
  "nomination":"Appointment","avis":"Notice","adjudication":"Tender award","circulaire":"Circular","autre":"Other"};
const tType=(v,lang)=>(((lang||LANG)==='en')&&TYPES_EN[v])||v||'';
const NIVEAUX_EN={"pièce":"item","dossier":"file","série":"series","sous-fonds":"sub-fonds","fonds":"fonds"};
const tNiveau=(v,lang)=>(((lang||LANG)==='en')&&NIVEAUX_EN[v])||v||'';
const MODES_EN={"assisté":"assisted","manuel":"manual"};
const tMode=v=>(LANG==='en'&&MODES_EN[v])||v||'';

const DELAIS={

  if(mode==='login'){

      const mail=document.getElementById('pl-mail').value.trim(), mdp=document.getElementById('pl-mdp').value;

let _traduction_en_cours=false;
function traduireDOM(){
  if(LANG!=='en'||_traduction_en_cours) return;
  _traduction_en_cours=true;
  try{ _traduireDOM(); } finally { _traduction_en_cours=false; }
}
function _traduireDOM(){
  // Un <option> sans attribut value= soumet son propre texte affiché comme valeur : le traduire
  // changerait la donnée enregistrée (ex. DB.config.mode==='assisté' casserait si l'option
  // affichait 'Assisted'). Un <option value="..."> explicite n'a pas ce problème : sa valeur
  // soumise reste celle de l'attribut quel que soit le texte affiché, donc sûr à traduire.
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      const p=node.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.tagName==='SCRIPT'||p.tagName==='STYLE') return NodeFilter.FILTER_REJECT;
      if(p.tagName==='OPTION'&&!p.hasAttribute('value')) return NodeFilter.FILTER_REJECT;
      if(p.tagName!=='OPTION'&&p.closest('select')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
  const L=[]; while(w.nextNode()) L.push(w.currentNode);
  // Ne réassigner nodeValue/l'attribut que si la traduction diffère réellement du texte déjà en
  // place : sinon, une entrée fr===en (ex. "Administration":"Administration") réécrirait sans fin
  // la même valeur, chaque réécriture étant elle-même une mutation qui réveille le MutationObserver
  // ci-dessous — boucle infinie constatée en test.
  L.forEach(n=>{ const raw=n.nodeValue, k=nk(raw); if(!k) return;
    const e=EN[k]; if(e&&!raw.includes(e)) n.nodeValue=raw.replace(raw.trim(),e); });
  ['placeholder','title','aria-label','alt'].forEach(attr=>{
    document.querySelectorAll('['+attr+']').forEach(el=>{
      if(el.tagName==='OPTION'||el.closest('select')) return;
      const v=el.getAttribute(attr), e=EN[nk(v)]; if(e&&v!==e) el.setAttribute(attr,e); }); });
}
// La quasi-totalité des gestionnaires de clic de l'atelier appellent directement une fonction
// renderX() (renderRech(), renderCmd(), renderTele()…) plutôt que de repasser par sync() — qui
// est la seule à appeler traduireDOM(). Plutôt que d'ajouter traduireDOM() après chacun des
// nombreux appels directs (fragile : le moindre oubli laisserait une page non traduite), un
// observateur regarde #app et retraduit après CHAQUE mutation du DOM, quelle que soit son origine.
new MutationObserver(()=>traduireDOM()).observe(document.body,{childList:true,subtree:true,characterData:true});

let LOT=[], LOT_META={operateur:'',materiel:'',serie:SERIES[6],numero_jo:'',cote:'',bordereauPdf:null}, LOT_FILES=[], lotEnCours=false;
const PRESCRIPTIONS={resolution:'400 dpi',master:'TIFF non compressé',diffusion:'PDF/A-2',
  couleur:'24 bits couleur, mire de contrôle en première page',nommage:'COTE_ANNEE_NUMERO_PAGE.tif'};

const octets=o=>o>1048576?(o/1048576).toFixed(1)+' Mo':Math.round(o/1024)+' Ko';
const triNaturel=(a,b)=>a.name.localeCompare(b.name,'fr',{numeric:true,sensitivity:'base'});

async function empreinteFichier(f){
  if(!(window.crypto&&crypto.subtle)) return '';
  const b=await crypto.subtle.digest('SHA-256', await f.arrayBuffer());
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const triNaturelLot=(a,b)=>a.nom.localeCompare(b.nom,'fr',{numeric:true,sensitivity:'base'});
async function chargerLot(files){
  lotEnCours=true; renderVersement();
  // S'ajoute au lot déjà chargé — ne le remplace pas — pour permettre de compléter un lot en plusieurs passes.
  const connus=new Set(LOT.map(x=>x.nom+'␀'+x.taille));
  const F=[...files].filter(f=>!connus.has(f.name+'␀'+f.size)).sort(triNaturel);
  for(const f of F){
    LOT.push({rang:0,nom:f.name,taille:f.size,type:f.type||'inconnu',
      empreinte:await empreinteFichier(f),fichier:f});
    LOT.sort(triNaturelLot); LOT.forEach((x,i)=>x.rang=i+1);
    renderVersement();
  }
  lotEnCours=false; renderVersement();
}

async function choisirDossier(){
  if(!window.showDirectoryPicker){ alert("Ce navigateur ne permet pas de désigner un dossier. Utilisez la sélection de fichiers multiples."); return; }
  try{
    const rep=await window.showDirectoryPicker();
    const out=[];
    for await (const [nom,h] of rep.entries()){
      if(h.kind!=='file') continue;
      if(!/\.(pdf|tif|tiff|jpe?g|png)$/i.test(nom)) continue;
      out.push(await h.getFile());
    }
    if(!out.length){ alert("Aucun fichier image ou PDF trouvé dans ce dossier."); return; }
    LOT_META.cote=LOT_META.cote||rep.name;
    await chargerLot(out);
  }catch(e){ if(e && e.name!=='AbortError') alert("Dossier non accessible : "+e.message); }
}

function renderVersement(){

  <div class="card"><h2>Identification du lot</h2>
    <dl class="dl">
      <dt>Opérateur</dt><dd><input id="m-op" value="${esc(LOT_META.operateur)}" placeholder="nom de l'agent ayant numérisé"></dd>

  <div class="card"><h2>Bordereau de versement</h2>
    <p class="sub">Deux voies : établir le bordereau depuis cette page une fois le lot repris (bouton ci-dessous, une fois le lot chargé), ou joindre un bordereau déjà produit ailleurs — remis sur papier puis scanné, ou issu d'un autre système.</p>
    ${LOT_META.bordereauPdf?`<p class="hint"><b>Bordereau joint :</b> <a href="${LOT_META.bordereauPdf.dataUrl}" target="_blank" rel="noopener">${esc(LOT_META.bordereauPdf.nom)}</a> (${octets(LOT_META.bordereauPdf.taille)}) <button class="b" id="bpdf-x" style="padding:2px 9px;font-size:12px;margin-left:8px">Retirer</button></p>`
      :`<input type="file" id="m-bpdf" accept="application/pdf">
        <p class="hint">Format PDF uniquement.</p>`}

  ${LOT.length?`<div class="card"><h2>Contenu du lot — ${LOT.length} fichier(s), ${octets(LOT.reduce((s,x)=>s+x.taille,0))}</h2>
    <p class="sub">Ordre établi par tri naturel des noms de fichiers. Vérifiez qu'il correspond à l'ordre des pages avant de poursuivre.</p>
    <table><tr><th>Rang</th><th>Fichier</th><th>Taille</th><th>Empreinte SHA-256</th></tr>
    ${LOT.map(x=>`<tr><td class="num">${x.rang}</td><td>${esc(x.nom)}</td><td class="num">${octets(x.taille)}</td>
      <td class="mono" style="font-size:11px">${x.empreinte?esc(x.empreinte.slice(0,16)+'…'):'—'}</td></tr>`).join('')}</table>

  <div class="card"><h2>Piloter le scanner depuis cette page</h2>
    <p class="sub" style="margin-bottom:10px">Ce n'est pas possible, et la limite tient au navigateur : aucune interface web n'accède aux pilotes TWAIN, SANE ou WIA. Deux montages existent.</p>

      <tr><td>Composant commercial embarqué</td><td>Bibliothèque propriétaire intégrée à la page</td><td>À écarter : licence par poste et dépendance à un éditeur, contraire à l'exigence de réversibilité</td></tr></table>

  const d=document.getElementById('dos'); if(d) d.onclick=choisirDossier;

  [['p-res','resolution'],['p-mas','master'],['p-dif','diffusion'],['p-col','couleur'],['p-nom','nommage']]
    .forEach(([id,k])=>{ const el=document.getElementById(id); if(el) el.onchange=()=>PRESCRIPTIONS[k]=el.value; });
  [['m-op','operateur'],['m-mat','materiel'],['m-ser','serie'],['m-num','numero_jo'],['m-cote','cote']]
    .forEach(([id,k])=>{ const el=document.getElementById(id); if(el) el.onchange=()=>LOT_META[k]=el.value; });

  if(t) t.onclick=()=>{ LOT_FILES=LOT.map(x=>x.fichier);

const BOILER=[
 /,?\s*à compter de la date de signature du présent (décret|arrêté|acte)\s*,?/gi,
 /Le présent (décret|arrêté|acte) sera enregistré[^.]*\./gi,

 /Le président de la République,?/gi, /Article premier\.\s*-\s*/gi, /Art\.\s*\d+\.\s*-\s*/gi,
 /Par (décret|arrêté|loi|ordonnance|décision)\s+N[°ºo][^:]{2,60}:/gi
];
function nettoieCorps(t){ let x=' '+t+' '; BOILER.forEach(r=>x=x.replace(r,' '));
  return x.replace(/\s+/g,' ').replace(/\s+([.,;:])/g,'$1').trim(); }

function proposerResumeFR(intitule,corps){
  const m=(intitule||'').match(/portant\s+(?:la\s+|le\s+|l')?([a-zà-ÿ']+)/i);
  const nom=m?m[1].toLowerCase().replace(/'$/,''):'';
  const verbe=VERBES[nom]||'';
  let objet=intitule.replace(/^[^]*?portant\s+/i,'').replace(new RegExp('^'+nom+"\\s*(d'|de\\s+la\\s+|des\\s+|du\\s+|de\\s+|d’)?",'i'),'').trim();
  let brut=(corps||'');
  if(intitule){ const i=brut.indexOf(intitule); if(i>=0&&i<200) brut=brut.slice(i+intitule.length); }
  const c=nettoieCorps(brut);
  const phrases=c.split(/(?<!\b[A-ZÉÈÀ])(?<!\bArt)(?<!\bMme)(?<!\bMle)(?<!\bMM)\.\s+/);
  let p1=(phrases.find(x=>x.trim().length>30)||'').trim();
  if(p1&&!/[.!?]$/.test(p1)) p1+='.';
  if(p1.length>300) p1=p1.slice(0,295).replace(/\s\S*$/,'')+'…';
  let out='';
  if(verbe) out=verbe+(objet?' '+objet:'')+'.';
  else if(intitule) out=intitule.replace(/^(Décret|Arrêté|Loi|Ordonnance|Décision)\s+/i,'').replace(/^portant\s+/i,'').trim()+'.';
  const norme=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3);
  const A1=norme(objet), B1=norme(p1);
  const commun=A1.length?A1.filter(w=>B1.includes(w)).length/A1.length:0;
  if(p1 && p1.length>25 && !(A1.length>=3 && commun>=0.7)) out+=' '+p1.charAt(0).toUpperCase()+p1.slice(1);
  out=out.replace(/\s+/g,' ').trim();
  return out.length>420?out.slice(0,415).replace(/\s\S*$/,'')+'…':out;
}
function proposerResumeEN(titreEN){
  if(!titreEN) return '';
  let t=titreEN.replace(/^(Decree|Order|Law|Decision|Ordinance|Notice)\s+to\s+/i,'').trim();
  if(t===titreEN) return '';
  const w=t.split(' '), v=w[0].toLowerCase();
  const irr={lay:'lays',pay:'pays',place:'places',open:'opens',set:'sets',put:'puts',make:'makes',
    increase:'increases',appoint:'appoints',establish:'establishes',create:'creates',repeal:'repeals',
    amend:'amends',fix:'fixes',authorise:'authorises',authorize:'authorizes',register:'registers'};
  let vv=irr[v]|| (/(s|x|ch|sh|o)$/.test(v)?v+'es' : /[^aeiou]y$/.test(v)?v.slice(0,-1)+'ies' : v+'s');
  w[0]=vv.charAt(0).toUpperCase()+vv.slice(1);
  return w.join(' ').replace(/\s+/g,' ').trim()+'.';
}

function proposerIndexation(fr,en){
  const T=(fr||'')+' '+(en||'');
  const th=THESAURUS.filter(c=>c.re.test(T));
  const geo=LIEUX.filter(([a,b])=>new RegExp('\\b'+a+'\\b','i').test(T)||new RegExp('\\b'+b+'\\b','i').test(T));
  const paysEtr=[...new Set((T.match(/en\s+République\s+d[eu']\s*([A-ZÉÈÀ][\wÀ-ÿ\-]+)/g)||[])
    .map(x=>x.replace(/^en\s+/i,'')))];
  // personnes
  const pers=[...new Set((fr.match(/\bM(?:me|lle|\.)\s+([A-ZÉÈÀÂÎÔÛ][\wÀ-ÿ'’\-]+(?:\s+[A-ZÉÈÀÂÎÔÛ][\wÀ-ÿ'’\-]+){0,3})/g)||[])
    .map(x=>x.replace(/^M(?:me|lle|\.)\s+/,'').trim()))].filter(x=>x.length>4).slice(0,30);
  // organismes, avec hiérarchie quand elle est explicite
  const org=[...new Set((fr.match(/\b(?:minist[èe]re\s+d[eu'’][^,.;:()]{3,60}|Présidence de la République|Caisse nationale de prévoyance sociale|sous-préfecture de\s+[A-ZÉÈ][\wÀ-ÿ\- ]{2,30}|Direction\s+d[eu'’][^,.;:()]{3,50}|Service\s+d[eu'’][^,.;:()]{3,50}|Division\s+d[eu'’][^,.;:()]{3,50})/gi)||[])
    .map(x=>x.replace(/\s+/g,' ').trim()))].slice(0,20)
    .map(x=>/^(Direction|Service|Division)/i.test(x)?'Présidence de la République > '+x:x);
  return {
    th_fr:th.map(c=>c.fr).join(', '), th_en:th.map(c=>c.en).join(', '),
    geo_fr:[...geo.map(g=>g[0]),...paysEtr].join(', '), geo_en:[...geo.map(g=>g[1]),...paysEtr].join(', '),
    pers:pers.join(', '), org_fr:org.join(', '), org_en:''
  };
}

// ══════════════════════════════════════════════════ RECONNAISSANCE LOCALE (sans réseau)
const MOISFR={janvier:1,février:2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,aout:8,
  septembre:9,octobre:10,novembre:11,décembre:12,decembre:12};
const MOISEN={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};

function isoDepuis(txt){
  if(!txt) return '';
  const t=txt.toLowerCase().replace(/\s+/g,' ').replace(/1\s*er\b|1\s*ᵉʳ/,'1')
    .replace(/\b[il]\s+(?=[a-zàâçéèêëîïôûùüÿ]+\s+\d{4})/,'1 '); // "I"/"l" pris pour "1" par l'OCR devant un nom de mois
  let m=t.match(/(\d{1,2})\s+([a-zàâçéèêëîïôûùüÿ]+)\s+(\d{4})/);
  if(m){ const mo=MOISFR[m[2]]||MOISEN[m[2]]; if(mo) return `${m[3]}-${String(mo).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`; }
  m=t.match(/(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{4})/);
  if(m) return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  return '';
}
const netto=t=>t.replace(/\u00AD/g,'').replace(/-\s*\n\s*/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
// L'entete courante de page (numero, nom du JO, date) chevauche les deux colonnes et se retrouve donc
// coupee en deux par le decoupage en x<50%/x>=50% : toujours en toute premiere ligne de chaque colonne,
// jamais ailleurs -- contrairement au nom du pays, qui peut legitimement apparaitre dans le texte d'un acte.
const sansEnTetePage=col=>{
  const nl=col.indexOf('\n'); if(nl<0) return col;
  const premiere=col.slice(0,nl);
  return (/cameroun|cameroon|gazette|journal officiel/i.test(premiere) || /^\d{1,4}\D/.test(premiere)) ? col.slice(nl+1).trim() : col;
};

// --- extraction de la couche texte d'une page, colonne par colonne ---
async function texteColonnes(page){
  const vp=page.getViewport({scale:1}), c=await page.getTextContent();
  const G=[[],[]];
  c.items.forEach(it=>{ if(!it.str||!it.str.trim()) return;
    const x=it.transform[4], y=it.transform[5];
    G[x < vp.width*0.5 ? 0 : 1].push({x,y,s:it.str}); });
  return G.map(col=>{
    col.sort((a,b)=> Math.abs(b.y-a.y)>3 ? b.y-a.y : a.x-b.x);
    let out='', dernier=null;
    col.forEach(it=>{ if(dernier!==null && Math.abs(dernier-it.y)>3) out+='\n';
      out+=(out&&!/\n$/.test(out)?' ':'')+it.s; dernier=it.y; });
    return sansEnTetePage(netto(out));
  });
}

// --- découpage d'une colonne française en actes ---
const TYPESRC={'décret':'décret','decret':'décret','arrêté':'arrêté','arrete':'arrêté','loi':'loi',
  'ordonnance':'ordonnance','décision':'décision','decision':'décision','insertion':'avis','inscription':'avis','avis':'avis'};

// Une ligne de bandeau (« PRESIDENCE DE LA REPUBLIQUE », en-tête de page…) est du texte tout en capitales ;
// un intitulé d'acte, même transcrit fidèlement, ne l'est jamais entièrement. Sert à ne pas remonter dedans.
const estEnTete=l=>{ const lettres=l.replace(/[^A-Za-zÀ-ÿ]/g,''); return lettres.length>4 && lettres===lettres.toUpperCase(); };
// Une marque de règle ou de colonne mal lue par l'OCR (|, /, —) peut précéder une ligne de clôture par ailleurs
// reconnaissable ; on l'ignore pour juger du début de la ligne, sans l'ôter du texte conservé.
const denoise=l=>l.replace(/^[^A-Za-zÀ-ÿ0-9]+/,'');
// Un fragment de 1-2 lettres isolé sur sa ligne (reste d'une règle de colonne mal lue par l'OCR) n'est
// jamais le début d'un intitulé : on l'ignore sans jamais le laisser interrompre la remontée.
const estBruit=l=>l.replace(/[^A-Za-zÀ-ÿ]/g,'').length<=2;

function decouperFR(txt){
  // Tolérant au bruit d'OCR : ni le numéro ni la date ne dépendent d'une ponctuation exacte
  // (un tiret mal lu, un « : » manquant en fin de ligne sont monnaie courante et ne doivent pas faire manquer l'acte).
  const ANCRE=/(?:Par\s+)?(décret|decret|arrêté|arrete|loi|ordonnance|décision|decision)?\s*N[°ºo]\s*([^\n]{1,45}?)\s*(?:\n|\s)*en\s+date\s+du\s+([^\n]{4,45}?)\s*[:;.]?\s*(?=\n|$)/gi;
  const A=[]; let m;
  while((m=ANCRE.exec(txt))!==null) A.push({i:m.index,fin:ANCRE.lastIndex,type:m[1]||'',num:m[2],date:m[3]});
  // titre de chaque acte, et position à laquelle il commence
  A.forEach((a,k)=>{
    const base=k?A[k-1].fin:0, win=txt.slice(base,a.i);
    const lignes=win.split('\n').map(x=>x.trim()).filter(Boolean);
    let titre='', premiere='';
    for(let j=lignes.length-1;j>=0 && j>=lignes.length-6;j--){
      const l=lignes[j], l0=denoise(l);
      if(estBruit(l)) continue;
      if(/^(Yaound|Maroua|Douala|Buea|Bamenda|Garoua|Le pr|Paul |\.{3,}|Art\.|Article)/i.test(l0) || estEnTete(l)){ if(titre) break; else continue; }
      titre=l+(titre?' '+titre:''); premiere=l;
      if(/^(Décret|Decret|Arrêté|Arrete|Loi|Ordonnance|Décision|Decision|Insertion|Inscription|Avis)\b/i.test(l0)) break;
    }
    a.intitule=titre.replace(/\s+/g,' ').trim();
    a.debut = premiere ? base+Math.max(0,win.lastIndexOf(premiere)) : a.i;
  });
  return A.map((a,k)=>{
    const fin = k+1<A.length ? A[k+1].debut : txt.length;
    let t=(a.type||a.intitule.split(/\s+/)[0]||'').toLowerCase().replace(/[^a-zà-ÿ]/g,'');
    return { type:TYPESRC[t]||'autre',
      numero:a.num.replace(/\s+/g,' ').replace(/\s*-\s*/g,'-').trim(),
      date_signature:isoDepuis(a.date), intitule:a.intitule, texte:txt.slice(a.debut,fin).trim() };
  });
}

// --- intitulés de la colonne anglaise, appariés par ordre d'apparition ---
// Contrairement au français, l'intitulé anglais ne commence presque jamais par le type d'acte
// (« Appointment of… », « Ratification of… ») : on ne peut pas le repérer par mot-clé en tête de ligne.
// On repère plutôt l'ancre « By Decree No. X of Y : » comme côté français, et on remonte jusqu'au titre qui la précède.
function titresEN(txt){
  const ANCRE=/(?:By\s+)?(Decree|Order|Law|Decision|Ordinance|Insertion|Registration|Notice)\s*(?:N[°ºo]|No\.?)\s*([^\n]{1,45}?)\s*(?:\n|\s)*of\s+([^\n]{4,45}?)\s*[:;.]?\s*(?=\n|$)/gi;
  const A=[]; let m;
  while((m=ANCRE.exec(txt))!==null) A.push({i:m.index,fin:ANCRE.lastIndex});
  return A.map((a,k)=>{
    const base=k?A[k-1].fin:0, win=txt.slice(base,a.i);
    const lignes=win.split('\n').map(x=>x.trim()).filter(Boolean);
    let titre='';
    for(let j=lignes.length-1;j>=0 && j>=lignes.length-6;j--){
      const l=lignes[j], l0=denoise(l);
      if(estBruit(l)) continue;
      if(/^(Yaound|Paul\s+Biya|President\s+of\s+the\s+Republic|\.{3,}|\d+[\.\)]\s|Article\b|Section\b)/i.test(l0) || estEnTete(l)){ if(titre) break; else continue; }
      titre=l+(titre?' '+titre:'');
    }
    return titre.replace(/\s+/g,' ').trim();
  });
}

async function pageEnImage(page){
  const base=page.getViewport({scale:1});
  const sc=Math.min(1.5, 1700/Math.max(base.width,base.height));
  const vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return c.toDataURL('image/jpeg',.72).split(',')[1];
}
async function reconnaitreLocal(fichiers,garderJournal){
  enCours=true; TROUVE=[]; if(!garderJournal) JOURNAL=[]; FICHIER=''; renderTele();
  const pages=[];
  try{
    for(const f of fichiers){
      if(f.type==='application/pdf'){
        if(!window.pdfjsLib) throw new Error('pdf.min.js absent du dossier');
        const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let p=1;p<=pdf.numPages;p++){
          const pg=await pdf.getPage(p);
          // L'image n'est pas nécessaire à l'extraction du texte (déjà dans la couche texte du PDF) : on la
          // conserve uniquement pour permettre, plus tard, la commande d'un scan de la page par un acheteur.
          pages.push({page:p, cols:await texteColonnes(pg), image:await pageEnImage(pg).catch(()=>'')});
        }
      } else if(/text|json/.test(f.type)||/\.(txt|md)$/i.test(f.name)){
        pages.push({page:pages.length+1, cols:[netto(await f.text()),'']});
      } else {
        JOURNAL.push({t:`${f.name} — image. La reconnaissance locale lit du texte, pas des pixels : une photographie ou un scan brut ne contient aucun caractère exploitable. Activez la reconnaissance de caractères dans le logiciel de votre scanner et versez le PDF ainsi produit.`,err:1});
      }
    }
  }catch(e){
      const w=/fake worker|Cannot load script|worker/i.test(e.message||'');
      JOURNAL.push({t:'Lecture impossible : '+e.message,err:1});
      if(w) JOURNAL.push({t:"Le navigateur refuse de charger le lecteur PDF parce que la page est ouverte directement depuis le disque. Lancez demarrer-atelier.bat, placé dans le même dossier : l'atelier s'ouvrira servi par un petit serveur local et la lecture des PDF fonctionnera. Sinon, ouvrez le PDF dans un lecteur, copiez le texte et collez-le dans le champ « Texte déjà transcrit ».",err:1});
      enCours=false; return renderTele(); }

  if(TEXTECOLLE.trim()) pages.push({page:pages.length+1, cols:[netto(TEXTECOLLE),'']});
  if(!pages.length){ JOURNAL.push({t:'Aucun texte exploitable.',err:1}); enCours=false; return renderTele(); }

  FICHIER=`${pages.length} page(s) analysée(s) sans réseau`;
  let vides=0;
  pages.forEach(pg=>{
    const [fr,en]=pg.cols;
    if(!fr || fr.length<40){ vides++; JOURNAL.push({t:`Page ${pg.page} — aucune couche texte : cette page est une image. La reconnaissance de caractères doit être faite en amont, dans le logiciel du scanner.`,err:1}); return; }
    const actes=decouperFR(fr), tEN=titresEN(en||'');
    actes.forEach((a,k)=>{
      const n={}; FIDS.forEach(f=> n[f]='');
      n.type=a.type; n.numero=a.numero; n.date_signature=a.date_signature;
      n.intitule_fr=a.intitule; n.intitule_en=tEN[k]||'';
      n.statut_en=tEN[k]?'transcrite de la source':'absente de la source';
      n.pages=String(pg.page); n.niveau='pièce'; n.langue=tEN[k]?'fr et en':'fr';
      n.resume_fr=proposerResumeFR(a.intitule,a.texte);
      n.resume_en=proposerResumeEN(tEN[k]||'');
      const ix=proposerIndexation(a.texte+' '+a.intitule, tEN[k]||'');
      n.th_fr=ix.th_fr; n.th_en=ix.th_en; n.geo_fr=ix.geo_fr; n.geo_en=ix.geo_en;
      n.pers=ix.pers; n.org_fr=ix.org_fr; n.org_en=ix.org_en;
      n.notec_fr="Notice établie par reconnaissance locale. Résumé analytique et indexation PROPOSÉS : à contrôler et amender. Intitulé, numéro et date à vérifier sur l'image.";
      n.notec_en="Description produced by local recognition. Analytical summary and indexing are PROPOSED: to be checked and amended. Title, number and date to be verified against the image.";
      if(!tEN[k]) n.notes_en="No English version identified on this page.";
      n._texte=a.texte; n._image=pg.image||'';
      TROUVE.push(n);
    });
    JOURNAL.push({t:`Page ${pg.page} — ${actes.length} acte(s) repéré(s), ${tEN.length} intitulé(s) anglais`});
  });

let OCR_WORKER=null;
async function ocrWorker(){
  if(OCR_WORKER) return OCR_WORKER;
  if(!window.Tesseract) throw new Error("tesseract.min.js absent du dossier");
  const opts = window.OCR_LOCAL ? {workerPath:'tesseract-worker.min.js',corePath:'tesseract-core.wasm.js',langPath:'.'} : {};
  try{
    OCR_WORKER = await Tesseract.createWorker('fra+eng', 1, opts);
  }catch(e){
    // Sous file:// (ouverture par double-clic), le navigateur refuse de charger le worker OCR — l'erreur
    // renvoyée n'est parfois même pas un objet Error (juste une chaîne), d'où le besoin de la retraiter ici.
    const brut=String((e&&e.message)||e||'');
    if(location.protocol==='file:'){
      throw new Error("le navigateur refuse de charger le moteur OCR parce que la page est ouverte directement depuis le disque. Lancez demarrer-atelier.bat, placé dans le même dossier : l'atelier s'ouvrira servi par un petit serveur local et l'OCR fonctionnera.");
    }
    throw new Error(brut||'échec du chargement du moteur OCR');
  }
  return OCR_WORKER;
}
function decoupeCanvas(source,x0,x1){
  const h=source.height, c=document.createElement('canvas'); c.width=x1-x0; c.height=h;
  c.getContext('2d').drawImage(source, x0,0,x1-x0,h, 0,0,x1-x0,h); return c;
}
async function ocrColonnes(source){
  const w=source.width, worker=await ocrWorker(), mi=Math.round(w*0.5);
  const [rf,re]=await Promise.all([worker.recognize(decoupeCanvas(source,0,mi)), worker.recognize(decoupeCanvas(source,mi,w))]);
  return [sansEnTetePage(netto(rf.data.text||'')), sansEnTetePage(netto(re.data.text||''))];
}
async function imageDe(data){
  const img=new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error('image illisible')); img.src='data:image/jpeg;base64,'+data; });
  return img;
}
async function reconnaitreOCR(fichiers){
  enCours=true; TROUVE=[]; JOURNAL=[]; FICHIER=''; renderTele();
  let pages=[];
  try{ pages=await pagesDe(fichiers); }
  catch(e){ JOURNAL.push({t:'Lecture du fichier impossible : '+e.message,err:1}); enCours=false; return renderTele(); }
  if(!pages.length){ JOURNAL.push({t:'Aucune page à traiter.',err:1}); enCours=false; return renderTele(); }

  FICHIER=`${pages.length} page(s) — reconnaissance OCR sans réseau, plusieurs dizaines de secondes par page`;
  JOURNAL.push({t:`${pages.length} page(s) à reconnaître. Préparation du moteur OCR…`}); renderTele();
  try{ await ocrWorker(); }
  catch(e){ JOURNAL.push({t:'Moteur OCR indisponible : '+e.message,err:1}); enCours=false; return renderTele(); }

  let vides=0;
  for(const pg of pages){
    JOURNAL.push({t:`Page ${pg.page} — reconnaissance OCR en cours…`}); renderTele();
    let fr='',en='';
    try{ const img=await imageDe(pg.data); [fr,en]=await ocrColonnes(img); }
    catch(e){ JOURNAL.push({t:`Page ${pg.page} — OCR impossible : ${e.message}`,err:1}); continue; }
    if(!fr || fr.length<40){ vides++; JOURNAL.push({t:`Page ${pg.page} — aucun texte exploitable reconnu (image de mauvaise qualité, ou page vide).`,err:1}); continue; }
    const actes=decouperFR(fr), tEN=titresEN(en||'');
    actes.forEach((a,k)=>{
      const n={}; FIDS.forEach(f=> n[f]='');
      n.type=a.type; n.numero=a.numero; n.date_signature=a.date_signature;
      n.intitule_fr=a.intitule; n.intitule_en=tEN[k]||'';
      n.statut_en=tEN[k]?'transcrite de la source':'absente de la source';
      n.pages=String(pg.page); n.niveau='pièce'; n.langue=tEN[k]?'fr et en':'fr';
      n.resume_fr=proposerResumeFR(a.intitule,a.texte);
      n.resume_en=proposerResumeEN(tEN[k]||'');
      const ix=proposerIndexation(a.texte+' '+a.intitule, tEN[k]||'');
      n.th_fr=ix.th_fr; n.th_en=ix.th_en; n.geo_fr=ix.geo_fr; n.geo_en=ix.geo_en;
      n.pers=ix.pers; n.org_fr=ix.org_fr; n.org_en=ix.org_en;
      n.notec_fr="Notice établie par reconnaissance OCR (sans réseau). Résumé analytique et indexation PROPOSÉS : à contrôler et amender. L'OCR peut se tromper sur les chiffres et les patronymes — intitulé, numéro et date à vérifier sur l'image.";
      n.notec_en="Description produced by offline OCR. Analytical summary and indexing are PROPOSED: to be checked and amended. OCR is error-prone on digits and personal names — title, number and date to be verified against the image.";
      if(!tEN[k]) n.notes_en="No English version identified on this page.";
      n._texte=a.texte; n._image=pg.data||'';
      TROUVE.push(n);
    });
    JOURNAL.push({t:`Page ${pg.page} — ${actes.length} acte(s) repéré(s) par OCR, ${tEN.length} intitulé(s) anglais`}); renderTele();
  }
  if(vides) JOURNAL.push({t:`${vides} page(s) sans texte exploitable sur ${pages.length}.`,err:1});
  JOURNAL.push({t:`Terminé : ${TROUVE.length} notice(s) proposée(s) par OCR, sans aucun appel réseau`});
  enCours=false; renderTele();
}

async function pagesDe(fichiers){
  const out=[];
  for(const f of fichiers){
    if(f.type==='application/pdf'){
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let p=1;p<=pdf.numPages;p++){
        const pg=await pdf.getPage(p);
        const base=pg.getViewport({scale:1});
        const sc=Math.min(1.5, 1700/Math.max(base.width,base.height));
        const vp=pg.getViewport({scale:sc});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
        await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        out.push({page:p,data:c.toDataURL('image/jpeg',.72).split(',')[1]});
      }
    }else{
      const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});
      out.push({page:1,data});
    }
  }
  return out;
}

let RESEAU=null;
async function appel(body){
  let r;
  try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }
  catch(e){ RESEAU=false; throw new Error("le service n'est pas joignable depuis cette page (réseau bloqué)"); }
  if(!r.ok){
    let m='';
    try{ const j=await r.json(); m=(j.error&&j.error.message)||JSON.stringify(j).slice(0,140); }
    catch(e){ m=(await r.text().catch(()=>'')).slice(0,140); }
    throw new Error('HTTP '+r.status+(m?' — '+m:''));
  }
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||'erreur renvoyée par le service');
  const t=(d.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim();
  if(!t) throw new Error('réponse vide');
  RESEAU=true; return t;
}

async function appelGemini(system,historique,contenuTour){
  if(!CLE_GEMINI) throw new Error("aucune clé API Gemini configurée");
  const contents=[...historique.map(h=>({role:h.role==='user'?'user':'model',parts:[{text:h.content}]})),
    {role:'user',parts:[{text:contenuTour}]}];
  let r;
  try{
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(CLE_GEMINI)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{maxOutputTokens:1000}})
    });
  }catch(e){ RESEAU=false; throw new Error("le service Gemini n'est pas joignable depuis cette page (réseau bloqué)"); }
  if(!r.ok){
    let m='';
    try{ const j=await r.json(); m=(j.error&&j.error.message)||JSON.stringify(j).slice(0,140); }
    catch(e){ m=(await r.text().catch(()=>'')).slice(0,140); }
    throw new Error('HTTP '+r.status+(m?' — '+m:''));
  }
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||'erreur renvoyée par Gemini');
  const cand=(d.candidates||[])[0];
  const t=cand&&cand.content&&cand.content.parts?cand.content.parts.map(p=>p.text||'').join('').trim():'';
  if(!t) throw new Error('réponse vide (peut-être filtrée par Gemini)');
  RESEAU=true; return t;
}

async function tester(){
  JOURNAL=[{t:'Test de connexion au modèle en cours…'}]; renderTele();
  try{ const t=await appel({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:"Réponds exactement : OK"}]});
    JOURNAL.push({t:'Connexion établie. Réponse reçue : '+t.slice(0,50)}); }
  catch(e){ JOURNAL.push({t:'Échec — '+e.message,err:1});
    JOURNAL.push({t:"Si le service n'est pas joignable, le traitement automatique ne fonctionnera pas ici. La saisie, les mesures, l'import de propositions et le catalogue restent utilisables.",err:1}); }
  renderTele();
}

async function traiter(fichiers){
  enCours=true;TROUVE=[];JOURNAL=[];FICHIER='';renderTele();
  let pages=[];
  try{ if(fichiers.length) pages=await pagesDe(fichiers); }
  catch(e){ JOURNAL.push({t:'Lecture du fichier impossible.',err:1}); enCours=false; return renderTele(); }
  CAPTURES.forEach((d,i)=> pages.push({page:pages.length+i+1,data:d}));
  if(!pages.length){ JOURNAL.push({t:'Aucune page à traiter.',err:1}); enCours=false; return renderTele(); }

  FICHIER=`${pages.length} page(s) — ${fichiers.length} fichier(s), ${CAPTURES.length} capture(s)`;
  const ko=Math.round(pages.reduce((s,p)=>s+p.data.length,0)/1365/pages.length);
  JOURNAL.push({t:`${pages.length} page(s) préparée(s), environ ${ko} Ko par image`}); renderTele();

  for(const pg of pages){
    const img={type:"image",source:{type:"base64",media_type:"image/jpeg",data:pg.data}};
    let texte='', okT=false, okE=false;
    try{
      texte=await appel({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:[img,{type:"text",text:PROMPT_TXT}]}]});
      okT=true;
      JOURNAL.push({t:`Page ${pg.page} — transcrite, ${Math.round(texte.length/5)} mots${/INCOMPLÈTE/.test(texte)?', tronquée':''}`});
    }catch(e){ JOURNAL.push({t:`Page ${pg.page} — transcription impossible : ${e.message}`,err:1}); }
    renderTele();
    try{
      let t=(await appel({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:[img,{type:"text",text:PROMPT}]}]}))
        .replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
      const i=t.indexOf('['),j=t.lastIndexOf(']');
      if(i<0||j<0) throw new Error('réponse non exploitable — '+t.slice(0,90));
      const A=JSON.parse(t.slice(i,j+1)); let k=0; okE=true;
      A.forEach(o=>{ const n={}; FIDS.forEach(f=> n[f]=Array.isArray(o[f])?o[f].join(', '):(o[f]==null?'':String(o[f])));
        if(!n.pages) n.pages=String(pg.page);
        n._texte=texte; n._page=pg.page; n._image=pg.data||'';
        if(n.type||n.intitule||n.numero){ TROUVE.push(n); k++; } });
      JOURNAL.push({t:`Page ${pg.page} — ${k} acte(s) repéré(s)`});
    }catch(e){ JOURNAL.push({t:`Page ${pg.page} — repérage impossible : ${e.message}`,err:1}); }
    renderTele();
    if(!okT&&!okE&&pg===pages[0]){
      if(RESEAU===false){
        JOURNAL.push({t:"Le service n'est pas joignable. Bascule automatique sur la reconnaissance locale, sans réseau."});
        enCours=false; renderTele();
        return reconnaitreLocal(fichiers,true);
      }
      JOURNAL.push({t:"Interruption : la première page a échoué sur les deux appels. Utilisez « Tester la connexion » pour identifier la cause.",err:1});
      break;
    }
  }
  JOURNAL.push({t:`Terminé : ${TROUVE.length} notice(s) proposée(s)`});
  enCours=false; CAPTURES=[]; LOT_FILES=[]; renderTele();
}

    ${proposVide?`<div class="warn"><b>La proposition en tête de file ne contient aucun champ reconnu</b> : la fiche ci-dessous s'ouvre donc vierge, ce n'est pas une anomalie de la saisie. Cliquez sur « Écarter » pour passer à la suivante, ou « Vider la file » si tout le lot est dans ce cas.</div>`:''}
    <div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px">Importer un fichier de propositions déjà préparé</div>
    <input type="file" id="lot" accept=".json">
    <p class="hint">Pas pour un PDF : pour lire un PDF ou un scan, utilisez l'onglet « Numériser et traiter ». Ce champ importe un fichier JSON de propositions déjà produit ailleurs — par exemple exporté par un collègue depuis « Numériser et traiter ».</p>
    ${DB.queue.length?`<div class="actions"><button class="b" id="vider">Vider la file</button></div>`:''}</div>`
  :DB.queue.length?`<div class="card" style="border-left:3px solid var(--ochre)"><h2>Une file attend</h2>
    <p class="sub" style="margin-bottom:0">${DB.queue.length} proposition(s) issues du téléversement ne seront pas utilisées : cette séance est en mode manuel, la fiche s'ouvre vierge. Pour les dérouler, cliquez sur « Changer de séance » et choisissez le mode assisté. La file reste intacte d'ici là.</p></div>`:''}
  <div class="fiche">
    <div class="fh2"><div class="cote"><b>${esc(c.serie)}</b><br>${esc(c.numero_jo||'numéro non précisé')} · ${esc(c.cote||'cote non précisée')}<br>archiviste : ${esc(c.annotateur)}</div>
      <button class="chipm ${ass?'m-assiste':'m-manuel'}" id="modeToggle" style="font:inherit;border:0;cursor:pointer" title="Cliquer pour basculer entre saisie manuelle et validation assistée">${ass?'validation assistée':'saisie manuelle'} ⇄</button></div>
    <div class="grp">${rows}</div>
    <div class="actions" style="padding:14px 20px;border-top:1px solid var(--ruleS);background:#FBFBF9;margin:0">

      <span style="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)">${DB.notices.length} notice(s) au catalogue</span></div>

    DB.config.mode=ass?'manuel':'assisté'; await save(); renderSaisie();
  };
  if(ass){
    document.getElementById('lot').onchange=lotFichier;
    const v=document.getElementById('vider');
    if(v) v.onclick=async()=>{ if(confirm('Vider la file ?')){DB.queue=[];await save();renderSaisie()} };
  }
  FIDS.forEach(id=>{ const e=document.getElementById('f-'+id);
    e.addEventListener('input',()=>marquer(id)); e.addEventListener('change',()=>marquer(id)); });

function renderConfig(){
  app.innerHTML=`<div class="card"><h2>Ouvrir une séance</h2>
    ${DB.queue.length?`<div class="warn" style="margin:0 0 16px"><b>${DB.queue.length} proposition(s) issues du téléversement attendent d'être validées.</b> Choisissez le mode <b>assisté</b> pour les dérouler ; en mode manuel, la fiche s'ouvrira vierge et la file restera intacte.</div>`:''}
    <p class="sub">Informations communes à tous les actes d'un même numéro. Le chronomètre démarre à l'ouverture de chaque fiche et s'arrête à l'enregistrement.</p>
    <div class="row"><label class="lb">Nom de l'archiviste<i>sert à mesurer l'accord entre annotateurs</i></label><div><input id="c-an" placeholder="ex. A. Mbarga" value="${esc(UTILISATEUR?UTILISATEUR.nom:'')}"></div></div>
    <div class="row"><label class="lb">Mode<i>manuel d'abord, assisté ensuite — jamais l'inverse</i></label><div><select id="c-mo"><option value="manuel" ${DB.queue.length?'':'selected'}>Manuel — fiche vierge</option><option value="assisté" ${DB.queue.length?'selected':''}>Assisté — fiche pré-remplie${DB.queue.length?` (${DB.queue.length} en file)`:''}</option></select></div></div>
    <div class="row"><label class="lb">Série</label><div><select id="c-se">${SERIES.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div>
    <div class="row"><label class="lb">Numéro du JO</label><div><input id="c-nu" placeholder="ex. spécial n° 4 du 1er mars 2024"></div></div>
    <div class="row"><label class="lb">Cote et institution</label><div><input id="c-co" placeholder="ex. ANC Yaoundé, 3AC/412"></div></div>
    <div class="actions"><button class="b pri" id="c-go">Commencer</button></div></div>`;
  document.getElementById('c-go').onclick=async()=>{
    const an=document.getElementById('c-an').value.trim(); if(!an) return document.getElementById('c-an').focus();
    DB.config={annotateur:an,mode:document.getElementById('c-mo').value,serie:document.getElementById('c-se').value,
      numero_jo:document.getElementById('c-nu').value.trim(),cote:document.getElementById('c-co').value.trim()};
    await save(); sync();
  };
}
function lotFichier(e){ const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=async()=>{ try{ const o=JSON.parse(r.result);
    const items=Array.isArray(o)?o:[o];
    // Un fichier au mauvais format pousserait des propositions vides : la fiche assistée s'ouvrirait
    // vierge sans que rien ne l'explique. On vérifie qu'au moins un champ attendu est effectivement rempli.
    const valides=items.filter(it=>it&&typeof it==='object'&&FIDS.some(k=>it[k]));
    if(!valides.length){ alert("Ce fichier ne contient aucune proposition reconnaissable : aucun des champs attendus (intitulé, type, numéro…) n'a été trouvé. Vérifiez qu'il s'agit bien d'un export de propositions, produit depuis l'onglet « Numériser et traiter »."); return; }
    if(valides.length<items.length) alert(`${items.length-valides.length} élément(s) ignoré(s) : ils ne correspondent à aucun champ attendu.`);
    DB.queue.push(...valides); await save(); renderSaisie();
  }catch(x){ alert("Fichier JSON illisible."); } };
  r.readAsText(f); }
function remplir(o){ propose={}; EXTRA=o;
  FIDS.forEach(id=>{ let v=o[id]; if(Array.isArray(v)) v=v.join(', '); v=v==null?'':String(v);
    propose[id]=v; document.getElementById('f-'+id).value=v;
    const w=document.getElementById('w-'+id); w.className='fld'+(v?' prop':'');
    w.querySelector('.tagmark').textContent=v?'proposé automatiquement':''; });
  tStart(); }
function marquer(id){ if(!propose) return;
  const w=document.getElementById('w-'+id), cur=document.getElementById('f-'+id).value, ch=cur!==propose[id];
  w.className='fld'+(ch?' corr':(propose[id]?' prop':''));
  w.querySelector('.tagmark').textContent=ch?'corrigé':(propose[id]?'proposé automatiquement':''); }
async function enregistrer(){
  const d=tStop(), c=DB.config, v={};
  FIDS.forEach(id=> v[id]=document.getElementById('f-'+id).value.trim());
  if(!v.type&&!v.intitule){ if(!confirm("Ni type ni intitulé renseignés. Enregistrer ?")){tResume();return} }
  DB.notices.push({id:'N'+Date.now()+Math.floor(Math.random()*99),annotateur:c.annotateur,mode:c.mode,
    serie:c.serie,numero_jo:c.numero_jo,cote:c.cote,...v,duree_s:d,texte:(EXTRA&&EXTRA._texte)||'',image:(EXTRA&&EXTRA._image)||'',
    champs_corriges:propose?FIDS.filter(k=>v[k]!==propose[k]):[],proposition:propose||null,horodatage:new Date().toISOString(),
    statut:'a_controler',controleur:null,dateControle:null});
  EXTRA=null;
  if(DB.queue.length) DB.queue.shift();
  ANCRAGE=null; await save(); renderSaisie();
}

// ══════════════════════════════════════════════════ 2bis. CONTRÔLE QUALITÉ (admin et contrôleurs)
// Réutilise la mise en page de la fiche d'indexation (mêmes champs ISAD(G), même disposition bilingue)
// pour que le contrôleur voie exactement ce que l'opérateur a saisi, en lecture seule.
const lireChamp=v=>{ v=(v==null?'':String(v)).trim(); return v?esc(v).replace(/\n/g,'<br>'):'<span style="color:var(--ink3)">—</span>'; };
let refusNotice=null;
function renderControle(){
  const attente=DB.notices.filter(n=>n.statut==='a_controler');
  if(!attente.length){ refusNotice=null; return vide("Aucune fiche en attente de contrôle."); }
  const n=attente[0];
  let rows='';
  for(const f of FIELDS){
    if(f[0]==='g'){ rows+=`<div class="grp-t">${esc(f[1])}</div>`; continue; }
    const[id,lb,help,kind,opts,bil]=f;
    const boite=v=>`<div class="fld" style="border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:#FAFAF8;font-size:13.5px;min-height:18px">${lireChamp(v)}</div>`;

    } else {
      rows+=`<div class="row"><label class="lb">${esc(lb)}${help?`<i>${esc(help)}</i>`:''}</label>${boite(n[id])}</div>`;
    }
  }
  const refus=refusNotice===n.id;
  app.innerHTML=`
  <div class="card" style="border-left:3px solid var(--ochre)"><h2>Contrôle qualité</h2>
    <p class="sub">${attente.length} fiche(s) en attente de validation avant publication au catalogue public. Vérifiez le contenu ci-dessous, puis validez ou refusez en précisant le motif.</p></div>
  <div class="fiche">
    <div class="fh2"><div class="cote"><b>${esc(n.serie)}</b><br>${esc(n.numero_jo||'numéro non précisé')} · ${esc(n.cote||'cote non précisée')}<br>saisi par : ${esc(n.annotateur)}</div>
      <div class="chipm ${n.mode==='assisté'?'m-assiste':'m-manuel'}">${esc(n.mode)}</div></div>
    <div class="grp">${rows}</div>
    <div class="actions" style="padding:14px 20px;border-top:1px solid var(--ruleS);background:#FBFBF9;margin:0;flex-wrap:wrap">
      ${refus?`<div class="row" style="width:100%;border:0"><label class="lb">Motif du refus</label><div><textarea id="motif-controle" placeholder="ex. intitulé incomplet, résumé à revoir…"></textarea></div></div>
        <button class="b pri" id="refuser-ok">Confirmer le refus</button><button class="b" id="refuser-annuler">Annuler</button>`
      :`<button class="b pri" id="valider-fiche">Valider</button><button class="b" id="refuser-fiche">Refuser</button>`}
      <span style="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)">${attente.length} en attente</span>
    </div>
  </div>`;
  const vb=document.getElementById('valider-fiche');
  if(vb) vb.onclick=async()=>{
    n.statut='validee'; n.controleur=UTILISATEUR.nomComplet||UTILISATEUR.nom; n.dateControle=new Date().toISOString();
    await save(); renderControle();
  };
  const rb=document.getElementById('refuser-fiche'); if(rb) rb.onclick=()=>{ refusNotice=n.id; renderControle(); };
  const ra=document.getElementById('refuser-annuler'); if(ra) ra.onclick=()=>{ refusNotice=null; renderControle(); };
  const ro=document.getElementById('refuser-ok');
  if(ro) ro.onclick=async()=>{
    const motif=document.getElementById('motif-controle').value.trim();
    if(!motif){ alert('Un motif est requis pour refuser une fiche.'); return; }
    n.statut='refusee'; n.controleur=UTILISATEUR.nomComplet||UTILISATEUR.nom; n.dateControle=new Date().toISOString(); n.motifControle=motif;
    refusNotice=null; await save(); renderControle();
  };
}

// ══════════════════════════════════════════════════ 3. MESURES
const fmt=s=>s<60?s+' s':Math.floor(s/60)+' min '+String(s%60).padStart(2,'0');
const med=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2)};
const moy=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0;
const jset=s=>new Set(String(s||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean));
function jac(a,b){const A=jset(a),B=jset(b); if(!A.size&&!B.size)return null; let i=0;A.forEach(x=>{if(B.has(x))i++}); return i/(A.size+B.size-i);}

function renderMesures(){
  const N=DB.notices;
  if(!N.length) return vide("Aucune fiche enregistrée. Les mesures apparaîtront dès la première validation.");
  const man=N.filter(n=>n.mode==='manuel').map(n=>n.duree_s), ass=N.filter(n=>n.mode==='assisté').map(n=>n.duree_s);
  const gain=(man.length&&ass.length&&med(ass))?(med(man)/med(ass)).toFixed(1)+'×':'—';
  const parS={}; N.forEach(n=>{(parS[n.serie]||={manuel:[],'assisté':[]})[n.mode].push(n.duree_s)});
  const corr={}; let nA=0;
  N.forEach(n=>{ if(n.mode==='assisté'&&n.proposition){nA++; (n.champs_corriges||[]).forEach(f=>corr[f]=(corr[f]||0)+1)} });
  const cr=Object.entries(corr).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const cle=n=>[n.numero_jo,n.numero||n.pages||(n.intitule||'').slice(0,40)].join('|').toLowerCase();
  const G={}; N.filter(n=>n.mode==='manuel').forEach(n=>(G[cle(n)]||=[]).push(n));
  const P=[]; Object.values(G).forEach(g=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++) if(g[i].annotateur!==g[j].annotateur) P.push([g[i],g[j]])});
  const acc={}; ['type','numero','date_signature','autorite'].forEach(f=>{
    const v=P.map(([a,b])=>(a[f]||'').trim().toLowerCase()===(b[f]||'').trim().toLowerCase()?100:0); acc[f]=v.length?moy(v):null; });
  const jt=P.map(([a,b])=>jac(a.th,b.th)).filter(x=>x!==null);

  app.innerHTML=`
  <div class="card"><h2>Le chiffre</h2>
    <p class="sub">Temps médian de production d'une fiche. Tout le chiffrage de la phase 1 en découle.</p>
    <div class="stats">
      <div class="stat"><div class="k">Manuel — médiane</div><div class="v">${man.length?fmt(med(man)):'—'}</div></div>
      <div class="stat"><div class="k">Assisté — médiane</div><div class="v">${ass.length?fmt(med(ass)):'—'}</div></div>
      <div class="stat"><div class="k">Gain</div><div class="v">${gain}</div></div>
      <div class="stat"><div class="k">Fiches</div><div class="v">${N.length} <small>${t(`dont ${ass.length} assistées`,`${ass.length} assisted`)}</small></div></div></div>
    ${(man.length&&ass.length)?`<p class="hint">À ${fmt(med(ass))} par acte, un agent produit environ ${Math.round(6*3600/Math.max(med(ass),1))} fiches par jour de 6 heures effectives, soit ${Math.round(6*3600/Math.max(med(ass),1)*220).toLocaleString('fr-FR')} par an.</p>`:`<p class="hint">Le gain exige une campagne dans chacun des deux modes.</p>`}</div>

  <div class="two">
    <div class="card"><h2>Par série</h2><table><tr><th>Série</th><th>Manuel</th><th>Assisté</th><th>n</th></tr>
      ${Object.entries(parS).map(([s,d])=>`<tr><td>${esc(s.split('(')[0])}</td><td class="num">${d.manuel.length?fmt(med(d.manuel)):'—'}</td>
      <td class="num">${d['assisté'].length?fmt(med(d['assisté'])):'—'}</td><td class="num">${d.manuel.length+d['assisté'].length}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>Champs les plus corrigés</h2>
      <p class="sub">${nA?`Sur ${nA} fiche(s) assistée(s). Ces champs sont à retravailler dans les consignes d'extraction.`:'Disponible après une campagne assistée.'}</p>
      ${cr.length?`<table>${cr.map(([f,c])=>`<tr><td>${esc(f)}</td><td style="width:40%"><div class="bar-mini"><i style="width:${Math.round(100*c/nA)}%"></i></div></td><td class="num">${Math.round(100*c/nA)} %</td></tr>`).join('')}</table>`:'<p class="empty">—</p>'}</div></div>

  <div class="card"><h2>Accord entre annotateurs</h2>
    <p class="sub">Calculé sur les actes saisis en mode manuel par deux archivistes différents. C'est votre plafond de qualité : aucun modèle ne fera mieux que l'accord entre deux professionnels.</p>
    ${P.length?`<table><tr><th>Champ</th><th>Accord</th><th></th></tr>
      ${['type','numero','date_signature','autorite'].map(f=>`<tr><td>${esc(f)}</td><td class="num">${acc[f]===null?'—':acc[f]+' %'}</td><td style="width:45%"><div class="bar-mini"><i style="width:${acc[f]||0}%"></i></div></td></tr>`).join('')}
      <tr><td>descripteurs thématiques</td><td class="num">${jt.length?Math.round(moy(jt.map(x=>x*100)))+' %':'—'}</td><td><div class="bar-mini"><i style="width:${jt.length?Math.round(moy(jt.map(x=>x*100))):0}%"></i></div></td></tr></table>
      <p class="hint">${P.length} paire(s) comparée(s). Un accord thématique sous 50 % signale un problème de plan de classement, pas de méthode.</p>`
    :`<p class="empty">Aucune paire comparable. Faites saisir les mêmes actes par deux archivistes en mode manuel, puis fusionnez les fichiers depuis l'onglet Données.</p>`}</div>`;
}

// ══════════════════════════════════════════════════ 4. DONNÉES
function renderDonnees(){
  const N=DB.notices;
  app.innerHTML=`
  <div class="card"><h2>Exporter</h2><p class="sub">Exportez à chaque fin de séance : c'est votre sauvegarde.</p>
    <div class="actions"><button class="b pri" id="ej">Export JSON</button><button class="b" id="ec">Export CSV</button></div></div>
  <div class="card"><h2>Importer et fusionner</h2>
    <p class="sub">Chargez le fichier d'un autre archiviste pour calculer l'accord. Les fiches déjà présentes ne sont pas dupliquées.</p>
    <input type="file" id="imp" accept=".json"><div id="im" class="hint"></div></div>
  <div class="card"><h2>Jeu de démonstration</h2>
    <p class="sub">Huit notices du JO spécial n° 4 du 1<sup>er</sup> mars 2024, pour démarrer un cours sur un catalogue déjà alimenté.</p>
    <div class="actions"><button class="b" id="seed">Charger les 8 notices</button>
      ${N.length?`<button class="b" id="wipe" style="color:var(--red)">Tout effacer</button>`:''}</div></div>
  <div class="card"><h2>Notices enregistrées</h2>
    ${N.length?`<table><tr><th>Archiviste</th><th>Mode</th><th>Type</th><th>Intitulé</th><th>Statut</th><th>Durée</th><th></th></tr>
    ${N.slice().reverse().map(n=>{
      const statut=n.statut==='a_controler'?`<span style="color:var(--ochre)">à contrôler</span>`
        :n.statut==='refusee'?`<span style="color:var(--red)" title="${esc(n.motifControle||'')}">refusée${n.motifControle?' — '+esc(n.motifControle.slice(0,40)):''}</span>`
        :`<span style="color:#255536">validée</span>`;
      return `<tr><td>${esc(n.annotateur)}</td><td>${esc(tMode(n.mode))}</td><td>${esc(tType(n.type))||'—'}</td>
      <td>${esc((LANG==='en'?(n.intitule_en||n.intitule_fr):(n.intitule_fr||n.intitule_en))||n.intitule||'').slice(0,52)||'—'}</td><td style="font-size:12.5px">${statut}</td><td class="num">${fmt(n.duree_s||0)}</td>
      <td><button class="b" style="padding:3px 9px;font-size:12px" data-del="${n.id}">Supprimer</button></td></tr>`;}).join('')}</table>`
    :'<p class="empty">Aucune notice.</p>'}</div>`;

  const jour=()=>new Date().toISOString().slice(0,10);
  document.getElementById('ej').onclick=()=>tele('depouillement-'+jour()+'.json',JSON.stringify(DB,null,2),'application/json');
  document.getElementById('ec').onclick=()=>{
    const cols=['annotateur','mode','serie','numero_jo','cote',...FIDS,'duree_s','horodatage'];
    const q=v=>'"'+String(Array.isArray(v)?v.join('; '):(v==null?'':v)).replace(/"/g,'""')+'"';
    tele('depouillement-'+jour()+'.csv','\uFEFF'+[cols.join(',')].concat(N.map(n=>cols.map(c=>q(n[c])).join(','))).join('\n'),'text/csv;charset=utf-8');
  };
  document.getElementById('imp').onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=async()=>{ try{ const o=JSON.parse(r.result);
      const h=new Set(DB.notices.map(x=>x.id)), a=(o.notices||[]).filter(x=>!h.has(x.id));
      DB.notices.push(...a); ANCRAGE=null; await save();
      document.getElementById('im').textContent=a.length+' notice(s) ajoutée(s).'; renderDonnees();
    }catch(x){ document.getElementById('im').textContent="Fichier illisible."; } };
    r.readAsText(f); };
  document.getElementById('seed').onclick=async()=>{
    const h=new Set(DB.notices.map(x=>x.id));
    DB.notices.push(...SEED.filter(s=>!h.has(s.id))); ANCRAGE=null; await save(); renderDonnees();
  };
  const w=document.getElementById('wipe');
  if(w) w.onclick=async()=>{ if(confirm('Effacer toutes les notices et la file ?')){ DB.notices=[];DB.queue=[];ANCRAGE=null;await save();sync(); } };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Supprimer cette notice ?')) return;
    DB.notices=DB.notices.filter(x=>x.id!==b.dataset.del); ANCRAGE=null; await save(); renderDonnees(); });
}
function tele(nom,contenu,mime){ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenu],{type:mime})); a.download=nom; a.click(); URL.revokeObjectURL(a.href); }

// Cherche la commande de texte integral validee la plus recente qui couvre cet acte, pour attribuer le tampon
// (nom du validateur, date) au bon document — DB.achats ne garde qu'un drapeau global, pas la commande d'origine.
function commandeValidantActe(id,offre){
  return DB.commandes.filter(c=>c.statut==='validee'&&c.actesIds.includes(id)&&(!offre||c.offre===offre))
    .sort((a,b)=>(b.dateValidation||'').localeCompare(a.dateValidation||''))[0];
}

// Document imprimable (PDF via la boite d'impression du navigateur — Enregistrer au format PDF) pour la
// transcription certifiee d'un ou plusieurs actes. Meme principe que bordereau() : pas de bibliotheque PDF,
// juste une page HTML mise en forme que le navigateur sait deja imprimer ou enregistrer en PDF.
// validateur/dateValidation ne sont fournis que pour un acte deja valide par le directeur : c'est ce qui
// declenche l'en-tete avec le sceau et le tampon d'authenticite en pied de document.
function documentTexte(items,ref,titrePage,validateur,dateValidation){
  const tampon = validateur ? `
    <div class="tampon">
      <svg viewBox="0 0 200 200" width="150" height="150">
        <defs>
          <path id="at-${ref}" d="M 25,105 A 78,78 0 0 1 175,105" />
          <path id="ab-${ref}" d="M 25,100 A 78,78 0 0 0 175,100" />
        </defs>
        <circle cx="100" cy="100" r="94" fill="none" stroke="#1a4d8f" stroke-width="2.5"/>
        <circle cx="100" cy="100" r="82" fill="none" stroke="#1a4d8f" stroke-width="1.2"/>
        <text font-size="12" fill="#1a4d8f" font-weight="bold" letter-spacing="2" font-family="Georgia, serif">
          <textPath href="#at-${ref}" startOffset="50%" text-anchor="middle">ARCHIVES NATIONALES DU CAMEROUN</textPath>
        </text>
        <text font-size="11" fill="#1a4d8f" font-weight="bold" letter-spacing="2" font-family="Georgia, serif">
          <textPath href="#ab-${ref}" startOffset="50%" text-anchor="middle">★ COPIE CERTIFIÉE CONFORME ★</textPath>
        </text>
      </svg>
      <div class="sceau-stamp"><img src="${LOGO_ANC}"></div>
      <div class="bas">${esc(validateur)}<br>${esc(dfr((dateValidation||'').slice(0,10)))}</div>
    </div>` : '';
  const doc=`<!doctype html><meta charset="utf-8"><title>${esc(titrePage)}</title>
<style>body{font:13px/1.6 Georgia,serif;max-width:19cm;margin:2cm auto;color:#111}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14px;margin:26px 0 4px;border-bottom:1px solid #999;padding-bottom:3px}
.entete{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1a2a4a;padding-bottom:12px;margin-bottom:18px}
.entete .sceau{width:58px;height:58px;overflow:hidden;border-radius:50%;flex:none}
.entete .sceau img{height:58px;width:auto;display:block}
.entete .inst{font-size:12px;line-height:1.5}
